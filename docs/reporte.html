<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reporte diario de flota - C&amp;H Maquinaria</title>
<style>
  :root { --verde: #2f6f3e; --verde-f: #eaf3ec; --rojo: #b3261e; --rojo-f: #fdecea; --gris: #5f6b64; --borde: #e3e8e5; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Arial, sans-serif; margin: 0; background: #f5f6f7; color: #1a1a1a; font-size: 15px; }
  header { background: var(--verde); color: white; padding: 16px; }
  header h1 { margin: 0; font-size: 19px; }
  header .sub { font-size: 14px; opacity: .92; margin-top: 4px; }
  header a { color: white; font-size: 13px; }
  nav { position: sticky; top: 0; z-index: 3; background: white; border-bottom: 1px solid var(--borde);
        display: flex; gap: 6px; overflow-x: auto; padding: 8px 12px; }
  nav a { flex: none; text-decoration: none; color: var(--verde); font-weight: 600; font-size: 13px;
          border: 1px solid #cfe0d1; border-radius: 999px; padding: 5px 11px; background: var(--verde-f); }
  main { max-width: 820px; margin: 0 auto; padding: 12px; }
  section { background: white; border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 14px;
            padding: 12px 14px; scroll-margin-top: 56px; }
  h2 { font-size: 17px; color: var(--verde); margin: 2px 0 10px; }
  .tarjetas { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
  .tarjeta { background: var(--verde-f); border-left: 4px solid var(--verde); padding: 8px 10px; }
  .tarjeta b { display: block; font-size: 20px; color: var(--verde); }
  .tarjeta span { font-size: 12px; color: var(--gris); }
  .estim { color: var(--rojo); }
  .alerta { background: var(--rojo-f); border-left: 4px solid var(--rojo); padding: 8px 10px; margin: 6px 0; font-size: 14px; }
  .nota { font-size: 12px; color: var(--gris); margin: 8px 0 0; }
  details { border-top: 1px solid var(--borde); }
  details:first-of-type { border-top: 0; }
  summary { cursor: pointer; list-style: none; padding: 10px 2px; display: flex; gap: 10px; align-items: baseline; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸"; color: #888; flex: none; transition: transform .15s; }
  details[open] > summary::before { transform: rotate(90deg); }
  summary .tit { flex: 1; min-width: 0; }
  summary .tit small { display: block; color: var(--gris); font-size: 12px; margin-top: 2px; }
  summary .cif { flex: none; text-align: right; font-variant-numeric: tabular-nums; font-size: 14px; }
  summary .cif small { display: block; color: var(--gris); font-size: 12px; }
  .dentro { padding: 0 0 10px 20px; }
  .dentro details summary { padding: 8px 2px; font-size: 14px; }
  .sin-geo > summary { background: var(--rojo-f); }
  .grupo { font-size: 12px; font-weight: 700; color: var(--verde); text-transform: uppercase; letter-spacing: .03em;
           margin: 12px 0 2px; }
  .tabla { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 7px 6px; text-align: left; border-bottom: 1px solid #eee; vertical-align: top; }
  th { background: #eef1ee; font-size: 12px; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tfoot td { font-weight: 700; background: #eef1ee; }
  .barra { display: inline-block; height: 8px; background: var(--verde); vertical-align: middle; margin-left: 6px; }
  ol.visitas { margin: 4px 0 6px; padding-left: 20px; font-size: 14px; }
  ol.visitas li { margin: 5px 0; }
  ol.visitas .hora { font-variant-numeric: tabular-nums; color: var(--gris); }
  a { color: var(--verde); }
  .vacio { color: var(--gris); padding: 8px 0; }
  @media (max-width: 520px) { body { font-size: 14px; } main { padding: 8px; } section { padding: 10px; }
    .ocm { display: none; } th, td { padding: 6px 4px; font-size: 13px; } td.dia { white-space: nowrap; } }
</style>
</head>
<body>
<header>
  <h1>Reporte diario de flota – C&amp;H Maquinaria</h1>
  <div class="sub" id="fecha">Cargando…</div>
  <a href="index.html">← Hectáreas y Flota</a>
</header>
<nav aria-label="Secciones">
  <a href="#resumen">Resumen</a><a href="#maquinas">Máquinas</a><a href="#camionetas">Camionetas</a>
  <a href="#camion">Camión</a><a href="#semana">7 días</a><a href="#sin-geocerca">Sin geocerca</a>
</nav>
<main id="contenido"></main>
<script>
// Datos: docs/datos/reporte_diario.json (lo publica el correo diario). Reglas en CLAUDE.md.
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const n = (v, d = 1) => Number(v || 0).toLocaleString('es-CL', { minimumFractionDigits: d, maximumFractionDigits: d });
const DIAS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const fc = iso => { const [a, m, d] = iso.split('-').map(Number); return `${DIAS[new Date(a, m - 1, d).getDay()]} ${String(d).padStart(2, '0')}-${String(m).padStart(2, '0')}`; };
const mapa = (url, txt = 'mapa') => url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${txt}</a>` : '';
const haTxt = (ha, sin) => (ha ? n(ha, 2) : (sin ? '' : '–')) + (sin ? ` <span class="estim">(~${n(sin)})</span>` : '');
const minTxt = m => m >= 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')} min` : `${m} min`;
const lugaresTxt = (lugares, sep) => lugares.map(l => l.tipo === 'campo' ? `<b>${esc(l.nombre)}</b>` : esc(l.nombre)).join(sep);

function seccionResumen(d) {
  const r = d.resumen, a = d.alertas;
  const senal = a.sin_senal.length ? a.sin_senal.map(x => `${esc(x.maquina)} (desde ${esc((x.ultima_conexion || '').slice(0, 5))}, ${esc(x.ubicacion || '')}) ${mapa(x.mapa)}`).join('; ') : 'ninguna';
  const sinGeo = a.sin_geocerca.length ? a.sin_geocerca.map(x => `${esc(x.maquina)} – ${n(x.horas)} h (~${n(x.ha)} ha) ${mapa(x.mapa)}`).join('; ') : 'ninguno';
  return `<section id="resumen"><h2>Resumen de ayer (${esc(d.fecha_texto)})</h2>
    <div class="tarjetas">
      <div class="tarjeta"><b>${r.maquinas} de ${r.total_maquinas}</b><span>máquinas trabajaron</span></div>
      <div class="tarjeta"><b>${n(r.ha, 2)} ha</b><span>en geocercas${r.ha_sin ? ` <span class="estim">+ ~${n(r.ha_sin)} ha sin geocerca</span>` : ''}</span></div>
      <div class="tarjeta"><b>${n(r.horas)} h</b><span>de las máquinas</span></div>
      <div class="tarjeta"><b>${n(r.km_camionetas, 0)} km</b><span>camionetas (${r.camionetas_movidas} de ${r.total_camionetas} se movieron)</span></div>
      <div class="tarjeta"><b>${n(r.km_camion, 0)} km</b><span>camión</span></div>
    </div>
    <div class="alerta"><b>GPS sin señal:</b> ${senal}</div>
    <div class="alerta"><b>Trabajo sin geocerca ayer:</b> ${sinGeo}</div>
    ${alarmasLabor(d)}
    <p class="nota">No trabajaron ayer: ${r.no_trabajaron} máquinas — ${r.en_cyh} en CYH, ${r.detenidas_fuera} detenidas fuera de CYH y ${r.sin_senal_30} sin señal hace más de 30 días (<a href="index.html#flota">ver en Flota</a>).</p>
  </section>`;
}

// Alarmas de labor de los 7 dias: fuera de temporada, REPASO y "Revisar labor".
function alarmasLabor(d) {
  const lista = (d.alarmas_labor || []).slice().reverse();
  if (!lista.length) return '<div class="alerta" style="background:#f6f8f7;border-color:#b9c0bb"><b>Alarmas de labor (7 días):</b> ninguna</div>';
  const filas = lista.map(a => `<tr><td>${fc(a.fecha)}</td><td>${esc(a.tipo)}</td><td>${esc(a.maquina)}</td><td>${esc(a.labor)}<br><small>${esc(a.cuartel)}</small></td><td class="n">${a.no_suma ? '~' : ''}${n(a.ha, 2)}${a.no_suma ? '<br><small>sin sumar</small>' : ''}</td></tr>`).join('');
  return `<details class="sin-geo" style="margin-top:6px"><summary><span class="tit"><b>Alarmas de labor (7 días): ${lista.length}</b><small>Fuera de temporada, repasos y "Revisar labor", para revisar</small></span></summary>
    <div class="dentro tabla"><table><thead><tr><th>Día</th><th>Tipo</th><th>Máquina</th><th>Labor · cuartel</th><th class="n">Ha</th></tr></thead><tbody>${filas}</tbody></table></div></details>`;
}

function seccionMaquinas(d) {
  let html = '', grupo = null;
  for (const m of d.maquinas) {
    if (m.grupo !== grupo) { grupo = m.grupo; html += `<div class="grupo">${esc(grupo)}</div>`; }
    const conSin = m.ha_sin > 0;
    const dias = m.dias.slice().reverse().map(x => {
      const lugares = x.lugares.map(l => `${esc(l.geocerca)} (${n(l.horas)} h)`);
      if (x.sin.length) lugares.push(`<span class="estim">sin geocerca ${n(x.horas_sin)} h</span> ${x.sin.map(s => mapa(s.mapa)).join(' ')}`);
      return `<tr><td>${fc(x.fecha)}</td><td>${lugares.join('<br>') || '–'}</td><td class="n">${haTxt(x.ha, x.ha_sin)}</td><td class="n">${n(x.horas)}</td></tr>`;
    }).join('');
    html += `<details class="${conSin ? 'sin-geo' : ''}"><summary><span class="tit">${esc(m.nombre)}<small>${esc(m.labor)} · ${m.dias_trabajo} día${m.dias_trabajo === 1 ? '' : 's'}</small></span>
      <span class="cif">${haTxt(m.ha, m.ha_sin)} ha<small>${n(m.horas)} h</small></span></summary>
      <div class="dentro"><table><thead><tr><th>Día</th><th>Dónde trabajó</th><th class="n">Ha</th><th class="n">Horas</th></tr></thead><tbody>${dias}</tbody></table>
      ${conSin && m.rendimiento ? `<p class="nota">Ha sin geocerca estimadas con su rendimiento real: ${n(m.rendimiento, 2)} ha/h.</p>` : ''}</div></details>`;
  }
  return `<section id="maquinas"><h2>Máquinas · últimos 7 días</h2>${html || '<p class="vacio">Sin trabajo.</p>'}
    <p class="nota">Entre paréntesis y en rojo, las hectáreas estimadas sin geocerca (horas × rendimiento real de la máquina en sus cuarteles con geocerca).</p></section>`;
}

function diaVehiculo(x, recorrido) {
  if (!x.se_movio) return `<details><summary><span class="tit">${fc(x.fecha)} · 0 km<small>No se movió${x.donde_quedo ? ' · en ' + esc(x.donde_quedo) : ''}</small></span></summary></details>`;
  const visitas = x.visitas.map(v => `<li><span class="hora">${esc(v.llegada)}</span> ${v.tipo === 'campo' ? `<b>${esc(v.nombre)}</b>${v.detalle && v.detalle !== v.nombre ? ` (${esc(v.detalle)})` : ''}` : esc(v.nombre)} · ${minTxt(v.minutos)} ${mapa(v.mapa)}</li>`).join('');
  return `<details><summary><span class="tit">${fc(x.fecha)} · ${n(x.km)} km · ${esc(x.salida || '')}–${esc(x.llegada || '')}<small>${lugaresTxt(x.lugares, recorrido ? ' → ' : ' · ') || 'camino'}</small></span></summary>
    <div class="dentro"><ol class="visitas">${visitas || '<li>Solo camino (sin paradas largas).</li>'}</ol></div></details>`;
}

function seccionVehiculos(id, titulo, lista, recorrido) {
  const html = lista.map(v => `<details><summary><span class="tit">${esc(v.nombre)}<small>${v.dias_movimiento} día${v.dias_movimiento === 1 ? '' : 's'} con movimiento</small></span>
      <span class="cif">${n(v.km)} km</span></summary><div class="dentro">${v.dias.slice().reverse().map(x => diaVehiculo(x, recorrido)).join('')}</div></details>`).join('');
  const total = lista.reduce((t, v) => t + v.km, 0);
  return `<section id="${id}"><h2>${titulo} · últimos 7 días</h2>${html}
    <p class="nota">Total: <b>${n(total)} km</b>. Al tocar un día: los lugares en orden, con hora de llegada, tiempo ahí y mapa. En negrita, los campos (geocercas); en texto normal, las comunas donde se detuvo 15 min o más.</p></section>`;
}

function seccionSemana(d) {
  const max = Math.max(...d.semana.map(x => x.ha), 0);
  const filas = d.semana.map(x => `<tr><td class="dia">${fc(x.fecha)}</td><td class="n">${x.maquinas}</td><td class="n">${n(x.ha, 2)}${x.ha_sin ? `<br><span class="estim">~${n(x.ha_sin)}</span>` : ''}${max ? `<span class="barra ocm" style="width:${Math.round(40 * x.ha / max)}px"></span>` : ''}</td><td class="n">${n(x.horas)}</td><td class="n">${n(x.km_camionetas, 0)}</td><td class="n">${n(x.km_camion, 0)}</td></tr>`).join('');
  const s = k => d.semana.reduce((t, x) => t + x[k], 0);
  const campos = d.campos.map(c => `<tr><td>${esc(c.campo)}</td><td>${esc(c.labores.join(', '))}</td><td class="n">${n(c.ha, 2)}</td><td class="n">${c.terminados}</td></tr>`).join('');
  return `<section id="semana"><h2>Últimos 7 días</h2>
    <div class="tarjetas">
      <div class="tarjeta"><b>${n(s('ha'), 2)} ha</b><span>en geocercas${s('ha_sin') ? ` <span class="estim">+ ~${n(s('ha_sin'))} ha sin geocerca</span>` : ''}</span></div>
      <div class="tarjeta"><b>${n(s('horas'))} h</b><span>de las máquinas</span></div>
      <div class="tarjeta"><b>${n(s('km_camionetas'), 0)} km</b><span>camionetas</span></div>
      <div class="tarjeta"><b>${n(s('km_camion'), 0)} km</b><span>camión</span></div>
    </div>
    <div class="tabla"><table style="margin-top:10px"><thead><tr><th>Día</th><th class="n">Máq.</th><th class="n">Ha</th><th class="n">Horas</th><th class="n">Km<br>cam.</th><th class="n">Km<br>camión</th></tr></thead>
      <tbody>${filas}</tbody><tfoot><tr><td>Total</td><td></td><td class="n">${haTxt(s('ha'), s('ha_sin'))}</td><td class="n">${n(s('horas'))}</td><td class="n">${n(s('km_camionetas'), 0)}</td><td class="n">${n(s('km_camion'), 0)}</td></tr></tfoot></table></div>
    ${campos ? `<details style="margin-top:8px"><summary><span class="tit">Avance por campo</span></summary><div class="dentro"><table><thead><tr><th>Campo</th><th>Labores</th><th class="n">Ha</th><th class="n">Terminados</th></tr></thead><tbody>${campos}</tbody></table></div></details>` : ''}
  </section>`;
}

function seccionSinGeocerca(d) {
  const html = d.sin_geocerca.map(g => {
    const rango = g.desde === g.hasta ? fc(g.desde) : `${fc(g.desde)} a ${fc(g.hasta)}`;
    const dias = g.dias.map(x => `<tr><td>${fc(x.fecha)}</td><td>${esc(x.maquina)}</td><td class="n">${n(x.horas)}</td><td class="n">~${n(x.ha)}</td><td>${mapa(x.mapa)}</td></tr>`).join('');
    return `<details class="sin-geo"><summary><span class="tit">${esc(g.lugar)}<small>${g.cerca ? `cerca de ${esc(g.cerca[0])} (${n(g.cerca[1])} km) · ` : ''}${rango} · ${g.n_dias} día${g.n_dias === 1 ? '' : 's'}</small></span>
      <span class="cif">~${n(g.ha)} ha<small>${n(g.horas)} h</small></span></summary>
      <div class="dentro"><table><thead><tr><th>Día</th><th>Máquina</th><th class="n">Horas</th><th class="n">Ha</th><th></th></tr></thead><tbody>${dias}</tbody></table></div></details>`;
  }).join('');
  const tot = k => d.sin_geocerca.reduce((t, g) => t + g[k], 0);
  return `<section id="sin-geocerca"><h2>Trabajo sin geocerca · últimos 7 días</h2>${html || '<p class="vacio">Sin trabajo fuera de geocercas.</p>'}
    ${html ? `<p class="nota">${d.sin_geocerca.length} lugares · ${n(tot('horas'))} h · ~${n(tot('ha'))} ha estimadas. Trabajo real en campos sin geocerca en Wialon: al crear la geocerca esas hectáreas se recuperan.</p>` : ''}</section>`;
}

fetch('datos/reporte_diario.json', { cache: 'no-store' }).then(r => r.json()).then(d => {
  document.getElementById('fecha').textContent = `Día reportado: ${d.fecha_texto} · actualizado ${d.generado}`;
  document.getElementById('contenido').innerHTML = seccionResumen(d) + seccionMaquinas(d)
    + seccionVehiculos('camionetas', 'Camionetas', d.camionetas, false)
    + seccionVehiculos('camion', 'Camión', d.camion, true) + seccionSemana(d) + seccionSinGeocerca(d);
  if (location.hash) { const el = document.querySelector(location.hash); if (el) el.scrollIntoView(); }
}).catch(() => { document.getElementById('contenido').innerHTML = '<section><p class="vacio">Todavía no hay reporte publicado.</p></section>'; });
</script>
</body>
</html>

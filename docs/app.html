<script>
// ===========================================================================
// App "Flota C&H" (reorganizacion pedida por el usuario 26-oct-2026): una sola
// direccion con secciones #operacion, #ayer, #flota, #historial y #ajustes.
// Etapa 1: Operacion (reemplaza la planilla del Drive, "Maquinas en operacion"
// de reporte2 y operacion.html), con la Agenda de trabajos (app_agenda.js).
// Etapa 2: Ayer y Flota (app_ayer_flota.js).
// Historial y Ajustes siguen, por ahora, en las paginas actuales (el menu
// comun lleva a ellas). Reglas en CLAUDE.md.
// Datos: datos/operacion.json, operacion_cambios.json, operacion_tiempos.json,
// reporte_v2.json (GPS, maquinas activas, operadores, Desde automatico),
// campos.json (campos de Wialon y equivalencias) y operadores.json (foto diaria).
// Guardar: Worker /operacion con el PIN -> operacion.yml -> operacion.py.
// ===========================================================================
const WORKER = 'https://disparador-reporte.dawn-band-fd6c.workers.dev';
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sinT = t => String(t || '').normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase();
const clave = t => sinT(t).replace(/[^a-z0-9]/g, '');
const fc = iso => iso ? `${iso.slice(8, 10)}-${iso.slice(5, 7)}-${iso.slice(0, 4)}` : '';
const CAMPOS_FILA = ['implemento', 'operador', 'campo', 'desde', 'destino'];
let OP = null, CAMBIOS = [], TIEMPOS = [], V = null, FOTO = {}, CAMPOS = { campos: [], equivalencias: {}, nombres_lista: {} };
const UI = { vista: leerLS('op_vista', innerWidth >= 1000 ? 'campo' : 'campo'), pestana: 'maquinas', filtro: 'todas', q: '', sel: null, qHist: '' };
let editado = {};

function leerLS(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch (e) { return d; } }
function escribirLS(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento */ } }
const esTaller = c => ['taller', 'cyh', 'taller (cyh)'].includes(sinT(c).trim());
// Nombre para mostrar: Taller; campo de Wialon (nombre limpio, aunque este escrito distinto,
// ej. "mercofrut" = MERCOFRUT); o nombre de la planilla con su equivalente de Wialon.
function nombreCampo(c) {
  if (!c) return '';
  if (esTaller(c)) return 'Taller (CYH)';
  const nl = CAMPOS.nombres_lista || {};
  if (nl[c]) return nl[c];
  const w = (CAMPOS.campos || []).find(x => clave(x) === clave(c));
  if (w) return nl[w] || w;
  const eq = equivalenciaDe(c);
  return eq.length ? `${c} (= ${eq.map(x => nl[x] || x).join(', ')})` : c;
}
const equivalenciaDe = c => (Object.entries(CAMPOS.equivalencias || {}).find(([k]) => clave(k) === clave(c)) || [null, []])[1];
const equivalentes = c => Object.keys(CAMPOS.equivalencias || {}).filter(k => (CAMPOS.equivalencias[k] || []).includes(c));
const desdeAuto = m => (V && V.desde_auto && V.desde_auto[m]) || '';
const gpsBase = m => (V && V.gps_maquinas && V.gps_maquinas[m]) || {};

// ---------------------------------------------------------------------------
// GPS al momento (pedido del usuario 29-oct-2026): al abrir la app y con el boton
// "Actualizar GPS", el Worker consulta a Wialon (solo lectura; el token es un
// secreto del Worker) la ultima posicion de las maquinas, como maximo una vez
// cada 2 min. El lugar (CYH, campo o sin geocerca) y los campos cercanos se
// calculan aqui con los contornos publicados (flota.json -> patio,
// geocercas.json). Siempre se muestra la hora de la posicion. Una maquina en
// traslado (20 km/h o mas en sus ultimos 15 min: va en camion o por camino) no
// genera sugerencias de mover hasta que se detenga.
// ---------------------------------------------------------------------------
const GPS_CADA_MS = 2 * 60 * 1000;
let VIVO = null, VIVO_PEDIDO = 0, VIVO_CONSULTANDO = false, VIVO_ERROR = '', GEO = null, MEMO_GPS = new Map();
const horaPos = ts => { const f = fechaChile(ts * 1000); return f.slice(0, 10) === fechaChile(Date.now()).slice(0, 10) ? f.slice(11) : `${f.slice(11)} del ${f.slice(0, 5)}`; };
function metros(lat1, lon1, lat2, lon2) {
  const k = Math.cos(lat1 * Math.PI / 180) * 111320;
  return [(lon2 - lon1) * k, (lat2 - lat1) * 110540];
}
function dentro(lon, lat, pol) {
  let d = false;
  for (let i = 0, j = pol.length - 1; i < pol.length; j = i++) {
    const [xi, yi] = pol[i], [xj, yj] = pol[j];
    if ((yi > lat) !== (yj > lat) && lon < (xj - xi) * (lat - yi) / (yj - yi + 1e-15) + xi) d = !d;
  }
  return d;
}
function distanciaPoligono(lat, lon, pol) {
  if (dentro(lon, lat, pol)) return 0;
  let mejor = Infinity;
  for (let i = 0, j = pol.length - 1; i < pol.length; j = i++) {
    const [ax, ay] = metros(lat, lon, pol[j][1], pol[j][0]), [bx, by] = metros(lat, lon, pol[i][1], pol[i][0]);
    const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy;
    const u = l ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / l)) : 0;
    mejor = Math.min(mejor, Math.hypot(ax + u * dx, ay + u * dy));
  }
  return mejor;
}
async function cargarGeo() {
  if (GEO) return;
  try {
    const g = await (await fetch('datos/geocercas.json', { cache: 'no-store' })).json();
    GEO = Object.entries(g).filter(([, v]) => (v.contorno || []).length > 2).map(([n, v]) => {
      const xs = v.contorno.map(p => p[0]), ys = v.contorno.map(p => p[1]);
      return { nombre: n, campo: window.Agenda ? Agenda.campoDeCuartel(n) : n, contorno: v.contorno, bbox: [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)] };
    });
    MEMO_GPS.clear();
  } catch (e) { /* sin red: el lugar queda sin calcular */ }
}
// Lugar de un punto: 'CYH', el campo de la geocerca, 'fuera de geocercas', o null si falta el contorno.
function lugarEn(lat, lon, base) {
  const patio = FLOTA && FLOTA.patio;
  if (patio ? dentro(lon, lat, patio) : (base.lugar === 'CYH' && base.lat != null && Math.hypot(...metros(lat, lon, base.lat, base.lon)) < 300)) return 'CYH';
  if (!GEO) return null;
  const g = GEO.find(x => lon >= x.bbox[0] && lon <= x.bbox[2] && lat >= x.bbox[1] && lat <= x.bbox[3] && dentro(lon, lat, x.contorno));
  return g ? g.campo : 'fuera de geocercas';
}
function cercanosEn(lat, lon) {
  if (!GEO) return [];
  const por = new Map();
  for (const x of GEO) {
    const [cx, cy] = metros(lat, lon, Math.max(x.bbox[1], Math.min(lat, x.bbox[3])), Math.max(x.bbox[0], Math.min(lon, x.bbox[2])));
    const caja = Math.hypot(cx, cy);
    if (caja > 15000 || caja >= (por.get(x.campo) ?? Infinity)) continue;
    por.set(x.campo, Math.min(por.get(x.campo) ?? Infinity, distanciaPoligono(lat, lon, x.contorno)));
  }
  return [...por].sort((a, b) => a[1] - b[1]).slice(0, 3).map(([campo, d]) => ({ campo, km: Math.round(d / 100) / 10 }));
}
// Comuna de una direccion de Wialon (igual que reporte_correo.localidad): sin pais, region ni calle.
const REGIONES = ['region', 'región', 'metropolitana', 'libertador', 'maule', 'valparaiso', 'valparaíso', 'biobio', 'biobío', 'nuble', 'ñuble', 'araucania', 'araucanía', 'coquimbo', 'los lagos', 'los rios', 'los ríos'];
function comunaDe(texto) {
  let p = String(texto || '').split(',').map(x => x.trim()).filter(x => x && x.toLowerCase() !== 'chile' && !REGIONES.some(r => x.toLowerCase().startsWith(r)));
  if (p.length >= 2) p = p.slice(1);
  p = p.filter(x => !/\d/.test(x));
  return p.length ? p[p.length - 1] : '';
}
// Hora de la posicion del tablero (cada 4 h) cuando no hay GPS al momento.
function horaTablero(m) {
  const f = FLOTA && (FLOTA.maquinas || []).find(x => x.nombre === m);
  return f && f.ultima_conexion ? f.ultima_conexion : '';
}
function gpsDe(m) {
  const b = gpsBase(m), x = VIVO && VIVO.maquinas && VIVO.maquinas[m];
  if (!x) {
    const h = horaTablero(m);
    return h ? { ...b, hora: h.slice(11) + (h.slice(0, 5) === fechaChile(Date.now()).slice(0, 5) ? '' : ` del ${h.slice(0, 5)}`), gps: `${b.gps || ''} · posición de las ${h.slice(11)}${h.slice(0, 5) === fechaChile(Date.now()).slice(0, 5) ? '' : ' del ' + h.slice(0, 5)} (tablero)` } : b;
  }
  const memo = MEMO_GPS.get(m);
  if (memo && memo.t === x.t && memo.campo === valorDe(m).campo) return memo.g;

// Listas de campos y operadores (con buscador, los mas usados primero y "+ nuevo")

function usos(tipo) {
  // Cuantas veces aparece cada valor en la foto diaria y en la operacion de hoy.
  const n = {};
  if (tipo === 'maquina') return n;
  const sumar = v => { if (v && !esTaller(v)) n[v] = (n[v] || 0) + 1; };
  for (const dia of Object.values(FOTO)) for (const x of Object.values(dia)) sumar(tipo === 'campo' ? x.campo : x.operador);
  for (const m of Object.keys(OP.maquinas)) sumar(valorDe(m)[tipo]);

}
function opciones(tipo) {
  const lista = [];
  if (tipo === 'campo') {
    for (const c of CAMPOS.campos || []) {
      if (CAMPOS.nombres_lista && !CAMPOS.nombres_lista[c]) continue;
      const eq = equivalentes(c);
      // Se busca tambien por los nombres unidos del campo ("nueces" -> El Volcan).
      lista.push({ valor: c, texto: nombreCampo(c), extra: eq.length ? '= ' + eq.join(', ') : '', buscar: (CAMPOS.campos_unidos || {})[c] || [] });
    }
    // Campos anotados que no son de Wialon (sin geocerca o nombre antiguo de la planilla).
    for (const m of Object.keys(OP.maquinas)) {
      const c = valorDe(m).campo;
      if (c && !esTaller(c) && !lista.some(o => clave(o.valor) === clave(c))) {
        const eq = equivalenciaDe(c);
        lista.push({ valor: c, texto: c, extra: eq.length ? '= ' + eq.map(x => (CAMPOS.nombres_lista || {})[x] || x).join(', ') : 'sin geocerca' });
      }
    }
  } else if (tipo === 'maquina') {
    // Maquinas activas (Agenda); "+ Máquina nueva…" para una arrendada o sin GPS.
    for (const u of unidades()) lista.push({ valor: u.maquina, texto: u.maquina, extra: u.labor || '' });
    return lista;
  } else {
    for (const o of ((V && V.operadores && V.operadores.lista) || [])) lista.push({ valor: o.operador, texto: o.operador, extra: o.otros_nombres.length ? '= ' + o.otros_nombres.join(', ') : '' });
    for (const m of Object.keys(OP.maquinas)) {
      const o = valorDe(m).operador;
      if (o && !lista.some(x => x.valor === o)) lista.push({ valor: o, texto: o, extra: '' });
    }
  }
  const u = usos(tipo);

  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));

// Abre la lista con buscador; resuelve con el valor elegido (o null).
function elegir(tipo, titulo, actual) {
  return new Promise(listo => {
    const capa = document.getElementById('capa');
    const todos = opciones(tipo);
    const top = todos.filter(o => o.usos > 0).sort((a, b) => b.usos - a.usos).slice(0, 6);
    const nuevoTxt = tipo === 'campo' ? '+ Campo nuevo…' : tipo === 'maquina' ? '+ Máquina nueva…' : '+ Operador nuevo…';
    capa.innerHTML = `<div class="selector-fondo"><div class="selector" role="dialog" aria-label="${esc(titulo)}">
      <header><b>${esc(titulo)}</b><input type="search" placeholder="Buscar…" autocomplete="off"></header>
      <div class="lista"></div><footer><button type="button" class="boton-sec" data-cerrar>Cancelar</button></footer></div></div>`;
    const caja = capa.querySelector('.lista'), entrada = capa.querySelector('input');
    const fin = v => { capa.innerHTML = ''; listo(v); };
    const boton = o => `<button type="button" data-v="${esc(o.valor)}">${esc(o.texto)}${o.extra ? ` <small>(${esc(o.extra)})</small>` : ''}${o.valor === actual ? ' <small>· actual</small>' : ''}</button>`;

      const q = sinT(entrada.value.trim());
      const pasa = o => !q || sinT([o.texto, o.extra, o.valor, ...(o.buscar || [])].join(' ')).includes(q);
      let html = '';
      if (!q && top.length) html += `<div class="tit">Más usados</div>` + top.map(boton).join('');
      const resto = todos.filter(pasa);
      html += `<div class="tit">${q ? 'Resultados' : 'Todos'}</div>` + (resto.map(boton).join('') || '<div class="vacio" style="padding:8px 14px">Sin resultados.</div>');
      if (tipo === 'operador' && !q) html = `<button type="button" data-v="">(sin operador)</button>` + html;
      html += `<button type="button" class="nuevo" data-nuevo>${nuevoTxt}${q ? ` «${esc(entrada.value.trim())}»` : ''}</button>`;

    }

        candidatos.map(x => `<button type="button" class="si" data-v="${esc(x.o.valor)}">Sí, es ${esc(x.o.texto)}</button>`).join('') +
        `<button type="button" data-nuevo-ok>No, es ${tipo === 'campo' ? 'un campo' : tipo === 'maquina' ? 'una máquina' : 'un operador'} nuevo</button></div>`;

}

// ---------------------------------------------------------------------------
// Donde esta la maquina: mapa chico, "Ver en el mapa", comuna y campos cercanos
// (pedido del usuario 27-oct-2026; tambien para las Preguntas rapidas de lugar).
// ---------------------------------------------------------------------------
const kmTxt = km => km < 0.1 ? 'dentro o al lado de' : `a ${String(km).replace('.', ',')} km de`;
function ubicacionHtml(m, conMapa) {
  const g = gpsDe(m);
  if (g.lat == null) return '';
  const d = 0.012;
  const mapa = conMapa ? `<iframe loading="lazy" title="Ubicación de ${esc(m)}" src="https://www.openstreetmap.org/export/embed.html?bbox=${g.lon - d},${g.lat - d * 0.7},${g.lon + d},${g.lat + d * 0.7}&layer=mapnik&marker=${g.lat},${g.lon}"></iframe>` : '';
  const cerca = (g.cercanos || []).map(c => `${kmTxt(c.km)} ${esc(nombreCampo(campoDeLugar(c.campo)))}`).join(' · ');
  const partes = [g.comuna ? esc(g.comuna) : '', cerca, g.hora ? 'posición de las ' + esc(g.hora) : '', g.mapa ? `<a href="${esc(g.mapa)}" target="_blank" rel="noopener">Ver en el mapa</a>` : ''];
  return `<div class="ubic">${mapa}<div class="lugar">${partes.filter(Boolean).join(' · ')}</div></div>`;
}
// Campo a menos de 2 km del GPS (para proponerlo directo), o null.
function campoCercano(m) {
  const c = (gpsDe(m).cercanos || [])[0];
  return c && c.km < 2 ? campoDeLugar(c.campo) : null;
}

// ---------------------------------------------------------------------------
// Sugerencias del GPS (para aprobar con un toque)
// ---------------------------------------------------------------------------
function campoDeLugar(lugar) {
  // El lugar del GPS es un campo de Wialon (nombre de campos unidos); se busca su valor en la lista.
  if (!lugar) return null;
  const o = opciones('campo').find(x => clave(x.valor) === clave(lugar) || clave(x.texto) === clave(lugar));
  return o ? o.valor : lugar;
}
function calzaCampo(anotado, lugar) {
  if (!anotado || !lugar) return false;
  if (clave(anotado) === clave(lugar)) return true;
  const eq = Object.entries(CAMPOS.equivalencias || {}).find(([k]) => clave(k) === clave(anotado));
  return !!(eq && eq[1].some(c => clave(c) === clave(lugar)));
}
const noEsDeCYH = m => ((V && V.no_en_planilla) || []).some(x => x.maquina === m && x.no_cyh);
function sugerencias() {
  const lista = [];
  for (const u of unidades()) {
    const m = u.maquina, v = valorDe(m), g = gpsDe(m);
    if (pendienteDe(m) || !g.lugar || (g.lugar !== 'CYH' && g.dias_sin_senal != null && g.dias_sin_senal >= 2)) continue;
    if (enCamino(m)) continue;  // va en traslado: se sugiere cuando se detenga
    const enCampo = v.campo && !esTaller(v.campo);
    const lugarCampo = g.lugar !== 'CYH' && g.lugar !== 'fuera de geocercas';
    if (enCampo && g.lugar === 'CYH') {
      lista.push({ m, texto: `${m} está en CYH según el GPS`, sub: `Anotada en ${nombreCampo(v.campo)}${g.hora ? ' · posición de las ' + g.hora : ''}`, boton: 'Volver a taller', fn: b => volverATaller(m, b) });
    } else if (lugarCampo && !calzaCampo(v.campo, g.lugar) && (enCampo || esTaller(v.campo) || !v.campo)) {
      const destino = campoDeLugar(g.lugar);
      lista.push({ m, texto: `${m} vista en ${nombreCampo(destino)}`, sub: `Anotada en ${v.campo ? nombreCampo(v.campo) : '(sin anotar)'} · ${g.gps || ''}`,
                   boton: `Mover a ${nombreCampo(destino)}`, fn: b => moverACampo(m, b, destino) });
    }
    else if ((esTaller(v.campo) || !v.campo) && g.lugar === 'fuera de geocercas' && g.dias_sin_senal != null && g.dias_sin_senal < 2 && !noEsDeCYH(m)) {
      const cerca = campoCercano(m);
      lista.push({ m, texto: `${m} está fuera de CYH según el GPS`, sub: `Anotada en ${v.campo ? 'Taller' : '(sin campo)'} · ${g.gps || ''}`, mapa: true,
                   boton: cerca ? `¿Mover a ${nombreCampo(cerca)}?` : 'Mover a campo…', fn: b => moverACampo(m, b, cerca || undefined),
                   otro: cerca ? (b => moverACampo(m, b)) : null });
    } else if (enCampo && g.lugar === 'fuera de geocercas' && g.dias_sin_senal != null && g.dias_sin_senal < 2) {
      // Sin geocerca a menos de 2 km de OTRO campo (y no cerca del anotado).
      const cerca = campoCercano(m);
      if (cerca && !calzaCampo(v.campo, cerca) && !(g.cercanos || []).some(c => c.km < 2 && calzaCampo(v.campo, c.campo))) {
        lista.push({ m, texto: `${m} está cerca de ${nombreCampo(cerca)}`, sub: `Anotada en ${nombreCampo(v.campo)} · ${g.gps || ''}`, mapa: true,
                     boton: `¿Mover a ${nombreCampo(cerca)}?`, fn: b => moverACampo(m, b, cerca), otro: b => moverACampo(m, b) });
      }
    }
    if (enCampo && !v.operador && g.trabajo_ayer) {
      lista.push({ m, texto: `${m} trabajó ayer sin operador`, sub: `En ${nombreCampo(v.campo)}`, boton: 'Elegir operador…', fn: b => cambiarOperador(m, b) });
    }
  }
  // Agenda: mover las maquinas asignadas el dia de inicio, marcar terminado y sus avisos.
  if (window.Agenda) {
    lista.push(...Agenda.sugerencias());
    for (const a of Agenda.avisos()) lista.push({ m: '', texto: a.texto.replace(/<[^>]+>/g, ''), sub: 'Aviso de la Agenda', boton: 'Ver en la Agenda', fn: () => { UI.pestana = 'agenda'; dibujar(); Agenda.abrir(a.t.id); } });
  }
  return lista;
}

// ---------------------------------------------------------------------------
// Dibujo
// ---------------------------------------------------------------------------
function gpsChip(m) {
  const g = gpsDe(m);
  if (!g.estado) return '<span class="marca m-sin_senal">sin dato GPS</span>';
  const t = g.estado === 'ok' ? '✓ ' + g.texto : g.estado === 'confirmar' ? 'no calza · ' + g.texto.replace(/^Confirmar · /, '') : g.texto;
  return `<span class="marca m-${esc(g.estado)}">${esc(t)}</span>`;
}
function pasa(m) {
  const v = valorDe(m), enCampo = v.campo && !esTaller(v.campo), f = UI.filtro;
  if (f === 'campo' && !enCampo) return false;
  if (f === 'taller' && !esTaller(v.campo)) return false;
  if (f === 'sinop' && !(enCampo && !v.operador)) return false;
  const q = sinT(UI.q.trim());
  if (!q) return true;
  const g = gpsDe(m);
  return [m, v.implemento, v.operador, v.campo, nombreCampo(v.campo), v.destino, g.texto, g.gps].some(t => sinT(t).includes(q));
}
function contarFiltro(k) {
  const f0 = UI.filtro, q0 = UI.q; UI.filtro = k; UI.q = '';
  const n = unidades().filter(u => pasa(u.maquina)).length;
  UI.filtro = f0; UI.q = q0; return n;
}

function vistaPorCampo() {
  const grupos = new Map();
  for (const u of unidades()) {
    if (!pasa(u.maquina)) continue;
    const v = valorDe(u.maquina);
    const k = esTaller(v.campo) ? '~taller' : !v.campo ? '~~sin' : (opciones('campo').find(o => clave(o.valor) === clave(v.campo)) || { valor: v.campo }).valor;
    if (!grupos.has(k)) grupos.set(k, []);
    grupos.get(k).push(u);
  }
  const orden = [...grupos.keys()].sort((a, b) => (a.startsWith('~') - b.startsWith('~')) || (a === '~taller') - (b === '~taller') || nombreCampo(a).localeCompare(nombreCampo(b), 'es'));
  if (!orden.length) return '<div class="vacio">Ninguna máquina para este filtro.</div>';
  return `<div class="campos">${orden.map(k => {
    const us = grupos.get(k), taller = k === '~taller';
    const titulo = taller ? 'Taller (CYH)' : k === '~~sin' ? 'Sin campo anotado' : nombreCampo(k);
    const calzan = us.filter(u => gpsDe(u.maquina).estado === 'ok').length;
    const items = us.map(u => {
      const m = u.maquina, v = valorDe(m), g = gpsDe(m);
      return `<button type="button" class="maq-item${UI.sel === m ? ' sel' : ''}" data-m="${esc(m)}"><span class="punto p-${esc(g.estado || 'sin_senal')}"></span>` +
        `<span class="nom">${esc(m)}<small>${esc(v.operador || 'sin operador')}${v.implemento ? ' · ' + esc(v.implemento) : ''}</small>` +
        `${g.traslado ? `<small>🚚 ${esc(g.gps)}</small>` : g.lugar === 'fuera de geocercas' && g.lat != null ? `<small>📍 ${esc([g.comuna, ...(g.cercanos || []).slice(0, 1).map(c => kmTxt(c.km) + ' ' + nombreCampo(campoDeLugar(c.campo))), g.hora].filter(Boolean).join(' · '))}</small>` : ''}${estadoSinc(m)}</span></button>`;
    }).join('');
    // Taller y "sin campo" van plegados (son largos); se abren solos al buscar o si hay algo sincronizando.
    const plegar = k.startsWith('~') && !UI.q.trim() && !us.some(u => pendienteDe(u.maquina) || resultadoDe(u.maquina));
    return `<div class="campo-card${taller ? ' taller' : ''}"><header><b>${esc(titulo)}</b><small>${us.length} máq.${taller ? '' : ` · ${calzan} ✓ GPS`}</small></header>` +
      (plegar ? `<details><summary class="ver-mas">Ver ${us.length} máquinas</summary>${items}</details>` : items) + '</div>';
  }).join('')}</div>`;
}

function panelMaquina(m) {
  if (!m || !OP.maquinas[m]) return '<div class="vacio">Toca una máquina para moverla, cambiar su operador o devolverla al taller.</div>';
  const v = valorDe(m), g = gpsDe(m), u = unidades().find(x => x.maquina === m) || {};
  const auto = desdeAuto(m), taller = esTaller(v.campo);
  const cerca = campoCercano(m), proponer = cerca && !calzaCampo(v.campo, cerca) && clave(cerca) !== clave(v.campo);
  return `<div class="panel"><h3>${esc(m)}</h3><div class="labor">${esc(u.labor || '')} ${estadoSinc(m)}</div>
    <div class="acciones-grandes">
      ${proponer ? `<button type="button" onclick="moverACampo('${esc(m)}', this, ${esc(JSON.stringify(cerca))})">¿Mover a ${esc(nombreCampo(cerca))}?</button>` : ''}
      <button type="button"${proponer ? ' class="sec"' : ''} onclick="moverACampo('${esc(m)}', this)">${proponer ? 'Mover a otro campo…' : 'Mover a campo'}</button>
      <button type="button" class="sec" onclick="cambiarOperador('${esc(m)}', this)">Cambiar operador</button>
      <button type="button" class="sec" onclick="volverATaller('${esc(m)}', this)"${taller ? ' disabled' : ''}>Volver a taller</button>
    </div>
    <div class="dato"><span>Campo</span><b>${esc(v.campo ? nombreCampo(v.campo) : '(sin anotar)')}</b></div>
    <div class="dato"><span>Operador</span><b>${esc(v.operador || '(sin operador)')}</b></div>
    ${taller ? '' : `<div class="dato"><span>Desde</span><span><input type="date" id="dato-desde" value="${esc(v.desde || auto)}" onchange="guardarDato('${esc(m)}', 'desde', this)"><br><span class="desde-txt">${v.desde ? 'puesta a mano' : (auto ? 'automática (GPS)' : 'sin dato del GPS')}</span></span></div>`}
    <div class="dato"><span>Próximo destino</span><input id="dato-destino" value="${esc(v.destino)}" maxlength="80" onchange="guardarDato('${esc(m)}', 'destino', this)"></div>
    <div class="dato"><span>Implemento</span><input id="dato-implemento" value="${esc(v.implemento)}" maxlength="80" onchange="guardarDato('${esc(m)}', 'implemento', this)"></div>
    <div class="dato" style="display:block"><span>GPS</span><div style="margin-top:4px">${gpsChip(m)}</div><div class="nota" style="margin-top:3px">${esc(g.gps || '')}${g.lat == null && g.mapa ? ` · <a href="${esc(g.mapa)}" target="_blank" rel="noopener">Ver en el mapa</a>` : ''}</div>${ubicacionHtml(m, true)}</div>
  </div>`;
}

function notaTraslado() {
  const ms = unidades().map(u => u.maquina).filter(m => enCamino(m) && !pendienteDe(m));
  const det = g => g.vivo ? `${Math.max(g.v || 0, (VIVO.maquinas[g.m] || {}).vmax || 0)} km/h${g.comuna ? ', en ' + g.comuna : ''}, ${g.hora}` : `en movimiento según el tablero${g.hora ? ', ' + g.hora : ''}`;
  return ms.length ? `<p class="nota">🚚 En traslado (se sugerirá cuando se detenga): ${ms.map(m => `${esc(m)} (${esc(det({ ...gpsDe(m), m }))})`).join(' · ')}</p>` : '';
}
function vistaSugerencias() {
  const s = sugerencias();
  if (!s.length) return '<div class="vacio">Sin sugerencias: lo anotado calza con el GPS.</div>' + notaTraslado();
  return notaTraslado() + s.map((x, i) => `<div class="sug"><div class="txt"><b>${esc(x.texto)}</b><small>${esc(x.sub)}</small></div>` +
    `<div class="botones"><button type="button" onclick="aplicarSugerencia(${i}, this)">${esc(x.boton)}</button>` +
    `${x.otro ? `<button type="button" class="sec" onclick="aplicarSugerencia(${i}, this, true)">Mover a otro campo…</button>` : ''}</div>` +
    `${x.mapa ? ubicacionHtml(x.m, true) : ''}</div>`).join('');
}
function aplicarSugerencia(i, boton, otro) { const s = sugerencias()[i]; if (s) (otro ? s.otro : s.fn)(boton); }

// Vista Tabla (la anterior de la pagina Operacion): edicion en la tabla y "Guardar cambios".
function opcionesSelect(tipo, actual) {
  const lista = opciones(tipo);
  const igual = actual && lista.find(o => clave(o.valor) === clave(actual));
  const base = tipo === 'campo' ? `<option value="">(sin anotar)</option><option value="Taller"${esTaller(actual) ? ' selected' : ''}>Taller (CYH)</option>` : `<option value="">(sin operador)</option>`;
  return base + lista.map(o => `<option value="${esc(o === igual ? actual : o.valor)}"${o === igual ? ' selected' : ''}>${esc(o.texto)}${o.extra ? ' (' + esc(o.extra) + ')' : ''}</option>`).join('') +
    `<option value="__nuevo">${tipo === 'campo' ? 'Otro campo…' : 'Nuevo operador…'}</option>`;
}
function vistaTabla() {
  let html = '', grupo = null;
  for (const u of unidades()) {
    if (!pasa(u.maquina)) continue;
    const m = u.maquina, v = valorDe(m), r = resultadoDe(m), auto = desdeAuto(m);
    if (u.grupo && u.grupo !== grupo) { grupo = u.grupo; html += `<tr class="grupo"><td colspan="7">${esc(grupo)}</td></tr>`; }
    const clase = pendienteDe(m) ? 'guardando' : cambiada(m) ? 'cambiada' : (r && !r.ok) ? 'fallo' : '';
    html += `<tr class="fila ${clase}" data-m="${esc(m)}"><td><b>${esc(m)}</b><br><small>${esc(u.labor)}</small><br>${estadoSinc(m)}</td>
      <td data-label="Implemento"><input data-k="implemento" value="${esc(v.implemento)}" maxlength="80"></td>
      <td data-label="Operador"><select data-k="operador">${opcionesSelect('operador', v.operador)}</select></td>
      <td data-label="Campo"><select data-k="campo">${opcionesSelect('campo', v.campo)}</select></td>
      <td data-label="Desde"><input data-k="desde" type="date" value="${esc(v.desde || auto)}"><br><span class="desde-txt">${v.campo && !esTaller(v.campo) ? (v.desde ? 'puesta a mano' : (auto ? 'automática (GPS)' : 'sin dato')) : ''}</span></td>
      <td data-label="Próximo destino"><input data-k="destino" value="${esc(v.destino)}" maxlength="80"></td>
      <td data-label="GPS">${gpsChip(m)}<div class="nota" style="margin:2px 0 0">${esc(gpsDe(m).gps || '')}</div></td></tr>`;
  }
  const n = Object.keys(editado).filter(cambiada).length;
  return `<div style="overflow-x:auto"><table class="tabla-op"><thead><tr><th>Máquina</th><th>Implemento</th><th>Operador</th><th>Campo</th><th>Desde</th><th>Próximo destino</th><th>GPS</th></tr></thead><tbody>${html || '<tr><td colspan="7" class="vacio">Ninguna máquina para este filtro.</td></tr>'}</tbody></table></div>
    <div style="height:70px"></div>
    <div class="barra-guardar"><button type="button" class="guardar" id="guardarTabla"${n ? '' : ' disabled'} onclick="guardarTabla(this)">${n ? `Guardar cambios (${n})` : 'Guardar cambios'}</button><span id="msg"></span></div>`;
}
async function guardarTabla(boton) {
  const ms = Object.keys(editado).filter(cambiada);
  if (!ms.length) return;
  const filas = ms.map(m => ({ maquina: m, ...Object.fromEntries(CAMPOS_FILA.map(k => [k, valorDe(m)[k] || ''])) }));
  const anteriores = editado; editado = {};
  await guardarFilas(filas, boton, () => { editado = anteriores; });
}

function historial() {
  const tiempo = {};
  for (const t of TIEMPOS) tiempo[t.id] = t;
  const q = sinT(UI.qHist.trim());
  const enRepo = new Set(CAMBIOS.map(c => (c.id || '') + '|' + c.maquina + '|' + c.cambio));
  const todos = CAMBIOS.concat(CAMBIOS_D1.filter(c => !enRepo.has((c.id || '') + '|' + c.maquina + '|' + c.cambio)).reverse());
  const filas = todos.slice().reverse().filter(c => !q || sinT([c.fecha, c.maquina, c.cambio, c.antes, c.despues].join(' ')).includes(q)).slice(0, 300).map(c => {
    const t = c.id && tiempo[c.id];
    const pub = !c.id ? '–' : (!t && c.ts) ? 'guardado al instante · copiando a GitHub…' : !t ? 'midiendo…' : t.segundos == null ? '<b style="color:var(--rojo)">no se vio en 20 min</b>' : t.segundos > 600 ? `<b style="color:var(--rojo)">${duracion(t.segundos)} ⚠</b>` : duracion(t.segundos);
    return `<tr class="hist"><td data-label="Fecha">${esc(c.fecha)}</td><td data-label="Máquina">${esc(c.maquina)}</td><td data-label="Qué cambió">${esc(c.cambio)}</td>` +
      `<td data-label="Antes → después">${esc(c.antes || '—')} → <b>${esc(c.despues || '—')}</b></td><td data-label="Quedó publicado en">${pub}</td></tr>`;
  }).join('');
  const semana = TIEMPOS.filter(t => t.recibido && Date.now() - t.recibido < 7 * 86400000);
  const seg = semana.filter(t => t.segundos != null).map(t => t.segundos).sort((a, b) => a - b);
  const lentos = semana.filter(t => t.segundos == null || t.segundos > 600);
  return `<section id="historial-cambios"><h2>Historial de cambios</h2>
    <p style="font-size:13px;margin:0 0 8px">${semana.length ? `Tiempo hasta quedar publicado (últimos 7 días): ${semana.length} guardado${semana.length === 1 ? '' : 's'}` +
      (seg.length ? ` · mediana ${duracion(seg[Math.floor(seg.length / 2)])} · máximo ${duracion(seg[seg.length - 1])}` : '') +
      (lentos.length ? ` · <b style="color:var(--rojo)">${lentos.length} demoraron más de 10 min</b>` : '') : '<span class="nota">Todavía no hay guardados medidos.</span>'}</p>
    <input class="buscador" style="width:100%;margin-bottom:8px" type="search" placeholder="Buscar en el historial (máquina, operador, campo…)" value="${esc(UI.qHist)}" oninput="UI.qHist = this.value; document.getElementById('cuerpoHist').innerHTML = filasHistorial()">
    <div style="overflow-x:auto"><table id="historial"><thead><tr><th>Fecha y hora</th><th>Máquina</th><th>Qué cambió</th><th>Antes → después</th><th>Quedó publicado en</th></tr></thead>
    <tbody id="cuerpoHist">${filas || '<tr><td colspan="5" class="vacio">Sin cambios.</td></tr>'}</tbody></table></div>
    ${lentos.length ? `<div class="aviso-lento" style="margin-top:8px">⚠ En los últimos 7 días ${lentos.length} guardado${lentos.length === 1 ? '' : 's'} demoró más de 10 minutos en quedar publicado.</div>` : ''}</section>`;
}
function filasHistorial() {
  const div = document.createElement('div'); div.innerHTML = historial();
  return div.querySelector('#cuerpoHist').innerHTML;
}

function dibujarOperacion() {
  const s = sugerencias().length;
  const segV = (k, t) => `<button type="button" class="${UI.vista === k ? 'activo' : ''}" onclick="UI.vista='${k}'; escribirLS('op_vista', '${k}'); dibujar()">${t}</button>`;
  const segP = (k, t) => `<button type="button" class="${UI.pestana === k ? 'activo' : ''}" onclick="UI.pestana='${k}'; dibujar()">${t}</button>`;
  const fb = (k, t) => `<button type="button" class="${UI.filtro === k ? 'activo' : ''}" onclick="UI.filtro='${k}'; dibujar()">${t} (${contarFiltro(k)})</button>`;
  const ancho = innerWidth >= 1000;
  const nAg = window.Agenda ? Agenda.avisos().length : 0;
  const cuerpo = UI.pestana === 'agenda' && window.Agenda ? Agenda.html()
    : UI.pestana === 'sugerencias' ? `<section><h2>Sugerencias del GPS</h2>${vistaSugerencias()}<p class="nota">Se aprueban con un toque (piden el PIN la primera vez en este aparato). Vienen de lo que ve el GPS ahora (máquina vista en otro campo, en CYH estando anotada en un campo, o trabajando sin operador) y de la Agenda (mover las máquinas el día de inicio, marcar terminado, avisos).</p></section>`
    : UI.vista === 'tabla' ? vistaTabla()
    : `<div class="op-layout"><div>${vistaPorCampo()}</div>${ancho ? `<div class="panel-lateral"><section>${panelMaquina(UI.sel)}</section><section><h2>Sugerencias del GPS (${s})</h2>${vistaSugerencias()}</section></div>` : ''}</div>`;
  return `<h1>Operación</h1><div class="sub">¿Quién va a dónde? · Guardado por última vez: ${esc(OP.actualizado || '')}${D1 ? ' · al instante (Cloudflare)' : ''}</div>
    <div class="sub" id="gpsBarra">${textoGps()}</div>
    <div id="avisoCF"></div>
    <div class="barra-op">
      <span class="seg">${segP('maquinas', 'Máquinas')}${segP('agenda', `Agenda${nAg ? `<span class="cuenta">${nAg}</span>` : ''}`)}${segP('sugerencias', `Sugerencias${s ? `<span class="cuenta">${s}</span>` : ''}`)}</span>
      ${UI.pestana === 'maquinas' ? `<span class="seg">${segV('campo', 'Por campo')}${segV('tabla', 'Tabla')}</span>` : ''}
      ${UI.pestana !== 'agenda' ? '<button type="button" class="boton-sec" onclick="descargarExcel()">Descargar Excel</button>' : ''}
      ${UI.vista !== 'tabla' || UI.pestana !== 'maquinas' ? '<span id="msg"></span>' : ''}
    </div>
    ${UI.pestana === 'maquinas' ? `<div class="barra-op"><input class="buscador" type="search" placeholder="Buscar máquina, operador o campo" value="${esc(UI.q)}" oninput="UI.q = this.value; redibujarLista()"></div>
      <div class="filtros">${fb('todas', 'Todas')}${fb('campo', 'En campo')}${fb('taller', 'En taller')}${fb('sinop', 'Sin operador')}</div>` : ''}
    <div id="vistaOp">${cuerpo}</div>
    ${UI.pestana === 'agenda' ? '' : historial()}`;
}
function redibujarLista() {
  const caja = document.getElementById('vistaOp');
  if (!caja) return;
  const tmp = document.createElement('div'); tmp.innerHTML = dibujarOperacion();
  caja.innerHTML = tmp.querySelector('#vistaOp').innerHTML;
  document.querySelectorAll('.filtros').forEach((f, i) => { const n = tmp.querySelectorAll('.filtros')[i]; if (n) f.innerHTML = n.innerHTML; });
}

function abrirHoja(m) {
  UI.sel = m;
  if (innerWidth >= 1000) { dibujar(); return; }
  const capa = document.getElementById('capa');
  capa.innerHTML = `<div class="hoja-fondo" onclick="cerrarHoja()"></div><div class="hoja"><button type="button" class="cerrar" onclick="cerrarHoja()" aria-label="Cerrar">×</button>${panelMaquina(m)}</div>`;
}
function cerrarHoja() { UI.sel = null; document.getElementById('capa').innerHTML = ''; }

// Ayer y Flota se vuelven a dibujar solo si cambiaron sus datos o se entro a la
// seccion (asi no se cierra lo desplegado); Operacion, siempre.
let pintado = '';
function dibujar() {
  const app = document.getElementById('app'), sec = seccion();
  if (sec === 'ayer' || sec === 'flota') {
    const datos = sec === 'ayer' ? FULL : FLOTA;
    if (sec === 'flota' && !FLOTA) { if (pintado !== 'flota:cargando') { pintado = 'flota:cargando'; app.innerHTML = '<div class="vacio">Cargando la flota…</div>'; cargarFlota().then(dibujar); } return; }
    if (sec === 'ayer' && !FULL) { app.innerHTML = '<div class="vacio">Cargando…</div>'; return; }
    const firma = sec + ':' + (sec === 'ayer' ? (FULL.v2 && FULL.v2.actualizado) + '|' + FULL.generado : FLOTA.actualizado);
    if (firma === pintado) return;
    pintado = firma;
    const modulo = sec === 'ayer' ? window.SeccionAyer : window.SeccionFlota;
    if (sec === 'ayer') modulo._full = FULL;
    app.innerHTML = modulo.html(datos);
    modulo.despues(app);
    return;
  }
  pintado = '';
  if (!OP) return;
  app.innerHTML = dibujarOperacion();
  avisoCF(false);
  // Hoja abierta en el celular: se actualiza con el estado nuevo.
  const hoja = document.querySelector('#capa .hoja');
  if (hoja && UI.sel) hoja.innerHTML = `<button type="button" class="cerrar" onclick="cerrarHoja()" aria-label="Cerrar">×</button>${panelMaquina(UI.sel)}`;
}

// Eventos: tocar una maquina; editar la tabla.
document.addEventListener('click', ev => {
  const b = ev.target.closest('.maq-item');
  if (b) abrirHoja(b.dataset.m);
});
document.addEventListener('change', async ev => {
  const el = ev.target, tr = el.closest('tr.fila');
  if (!tr || !el.dataset.k) return;
  const m = tr.dataset.m, k = el.dataset.k;
  let valor = el.value;
  if (valor === '__nuevo') {
    valor = await elegir(k === 'campo' ? 'campo' : 'operador', k === 'campo' ? `Campo de ${m}` : `Operador de ${m}`, valorDe(m)[k]);
    if (valor == null) { dibujar(); return; }
  }
  editado[m] = { ...(editado[m] || {}), [k]: (valor || '').trim() };
  if (k === 'campo') editado[m].desde = '';  // cambia el campo: "Desde" vuelve a automatico
  dibujar();
});
document.addEventListener('input', ev => {
  const el = ev.target, tr = el.closest('tr.fila');
  if (!tr || !el.dataset.k || el.tagName !== 'INPUT') return;
  const m = tr.dataset.m;
  editado[m] = { ...(editado[m] || {}), [el.dataset.k]: el.value.trim() };
  tr.classList.toggle('cambiada', !!cambiada(m));
  const n = Object.keys(editado).filter(cambiada).length, g = document.getElementById('guardarTabla');
  if (g) { g.disabled = !n; g.textContent = n ? `Guardar cambios (${n})` : 'Guardar cambios'; }
});

function descargarExcel() {
  const ir = () => {
    const filas = unidades().map(u => {
      const v = valorDe(u.maquina), g = gpsDe(u.maquina);
      return [u.maquina, u.labor, v.implemento, v.operador, v.campo ? nombreCampo(v.campo) : '', v.desde ? fc(v.desde) : (desdeAuto(u.maquina) ? fc(desdeAuto(u.maquina)) + ' (auto)' : ''), v.destino, [g.texto, g.gps].filter(Boolean).join(' · ')];
    });
    const hoja = XLSX.utils.aoa_to_sheet([['Máquina', 'Labor', 'Implemento', 'Operador', 'Campo', 'Desde', 'Próximo destino', 'GPS'], ...filas]);
    hoja['!cols'] = [{ wch: 30 }, { wch: 18 }, { wch: 18 }, { wch: 20 }, { wch: 28 }, { wch: 14 }, { wch: 22 }, { wch: 50 }];
    const hist = XLSX.utils.aoa_to_sheet([['Fecha y hora', 'Máquina', 'Qué cambió', 'Antes', 'Después'], ...CAMBIOS.slice().reverse().map(c => [c.fecha, c.maquina, c.cambio, c.antes, c.despues])]);
    const libro = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(libro, hoja, 'Operación'); XLSX.utils.book_append_sheet(libro, hist, 'Historial');
    XLSX.writeFile(libro, `Operacion_${new Date().toISOString().slice(0, 10)}.xlsx`);
  };
  if (window.XLSX) return ir();
  const sc = document.createElement('script');
  sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  sc.onload = ir; sc.onerror = () => aviso('No se pudo cargar el generador de Excel.', true);
  document.head.appendChild(sc);
}

// ---------------------------------------------------------------------------
// Carga y secciones (#operacion; las demas, por ahora, en las paginas actuales)
// ---------------------------------------------------------------------------
// Estado de la base de Cloudflare (D1): operacion al instante para todos los celulares.
let D1 = false, VERSION = null, CAMBIOS_D1 = [];
function aplicarEstado(e) {
  if (!e || !e.d1) return;
  D1 = true; VERSION = e.version;
  OP = { ...(OP || {}), maquinas: e.maquinas, actualizado: e.actualizado || (OP && OP.actualizado) };
  CAMBIOS_D1 = (e.cambios || []).map(c => ({ fecha: fechaChile(c.ts), maquina: c.maquina, cambio: c.cambio, antes: c.antes, despues: c.despues, id: c.guardado, ts: c.ts }));
  if (window.Agenda) Agenda.desdeD1(e);
}
const fechaChile = ts => new Intl.DateTimeFormat('es-CL', { timeZone: 'America/Santiago', day: '2-digit', month: '2-digit', year: 'numeric',
  hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date(ts)).replace(/\//g, '-').replace(',', '');
async function leerD1(ruta) {
  const control = new AbortController(); const t = setTimeout(() => control.abort(), 4000);
  try { const r = await fetch(WORKER + ruta, { cache: 'no-store', signal: control.signal }); return r.ok ? await r.json() : null; }
  catch (e) { return null; } finally { clearTimeout(t); }
}
// Otro celular guardo: se ve en menos de 5 s (revisa la version cada 3 s).
setInterval(async () => {
  if (!D1 || document.visibilityState !== 'visible' || escribiendo() || document.querySelector('#capa .selector')) return;
  const v = await leerD1('/version');
  if (v && v.d1 && v.version !== VERSION) { aplicarEstado(await leerD1('/estado')); if (seccion() === 'operacion') dibujar(); }
}, 3000);

async function cargar(soloOperacion) {
  const leer = (u, def) => fetch(u + '?x=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.json() : def).catch(() => def);
  const [op, cambios, tiempos, v2, campos, foto, agenda, agendaCambios] = await Promise.all([leer('datos/operacion.json', null), leer('datos/operacion_cambios.json', []),
    leer('datos/operacion_tiempos.json', []), soloOperacion && V ? { v2: V } : leer('datos/reporte_v2.json', {}),
    soloOperacion && CAMPOS.campos.length ? CAMPOS : leer('datos/campos.json', {}), soloOperacion ? { dias: FOTO } : leer('datos/operadores.json', {}),
    leer('datos/agenda.json', null), leer('datos/agenda_cambios.json', [])]);
  if (window.Agenda) Agenda.desdePublicado(agenda, agendaCambios);
  if (!op) { if (!OP) document.getElementById('app').innerHTML = '<div class="vacio">Todavía no se carga la operación.</div>'; return; }
  OP = op; CAMBIOS = cambios || []; TIEMPOS = tiempos || []; V = (v2 && v2.v2) || V; CAMPOS = campos || CAMPOS; FOTO = (foto && foto.dias) || {};
  if (!soloOperacion && v2 && v2.resumen) FULL = v2;
  // La operacion al instante viene de Cloudflare (D1); si no responde, queda lo publicado en GitHub.
  const e = await leerD1('/estado');
  if (e && e.d1) aplicarEstado(e); else D1 = false;
}
// Ayer (reporte_v2.json completo) y Flota (flota.json, se baja al entrar a Flota).
let FULL = null, FLOTA = null;
async function cargarFlota() {
  try { const r = await fetch('datos/flota.json?x=' + Date.now(), { cache: 'no-store' }); if (r.ok) FLOTA = await r.json(); } catch (e) { /* sin red: queda lo anterior */ }
  if (!FLOTA) FLOTA = null;
}
const SECCIONES_FUERA = { historial: 'index.html', ajustes: 'reporte2.html#equivalencias' };
const SECCIONES = ['operacion', 'ayer', 'flota'];
const seccion = () => { const s = (location.hash || '#operacion').slice(1); return SECCIONES.includes(s) ? s : 'operacion'; };
function ruta() {
  const s = (location.hash || '#operacion').slice(1);
  if (SECCIONES_FUERA[s]) { location.replace(SECCIONES_FUERA[s]); return false; }
  return true;
}
window.addEventListener('hashchange', () => { if (ruta()) { cerrarHoja(); dibujar(); window.scrollTo(0, 0); } });
// Ayer y Flota se actualizan solas cada 5 min con la app abierta (y al volver a la app).
async function refrescarSeccion() {
  const sec = seccion();
  if (document.visibilityState !== 'visible') return;
  if (sec === 'flota') { await cargarFlota(); dibujar(); }
  else if (sec === 'ayer') { const r = await fetch('datos/reporte_v2.json?x=' + Date.now(), { cache: 'no-store' }).then(x => x.ok ? x.json() : null).catch(() => null); if (r && r.resumen) { FULL = r; V = r.v2 || V; } dibujar(); }
}
setInterval(refrescarSeccion, 5 * 60 * 1000);
document.addEventListener('visibilitychange', refrescarSeccion);
// Solo se redibuja al cruzar el ancho del computador (el teclado del celular tambien cambia el alto).
let eraAncho = innerWidth >= 1000;
window.addEventListener('resize', () => { const a = innerWidth >= 1000; if (OP && a !== eraAncho) { eraAncho = a; dibujar(); } });
const escribiendo = () => { const f = document.activeElement; return f && /INPUT|SELECT|TEXTAREA/.test(f.tagName); };
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if (ruta()) cargar().then(() => { dibujar(); if (PEND.length) vigilar(); actualizarGps(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && OP) actualizarGps(); });
setInterval(() => { if (OP && seccion() === 'operacion' && document.visibilityState === 'visible' && !vigilando && !escribiendo() && !document.querySelector('#capa .selector')) dibujar(); }, 60000);
</script>

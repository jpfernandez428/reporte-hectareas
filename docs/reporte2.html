<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flota C&amp;H</title>
<!-- App para el celular (PWA): se agrega a la pantalla de inicio. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f6f3e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flota C&amp;H">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icono-192.png">
<script src="pin.js"></script>
<style>
  :root { --verde: #2f6f3e; --verde-f: #eaf3ec; --rojo: #b3261e; --rojo-f: #fdecea; --gris: #5f6b64; --borde: #e3e8e5; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Arial, sans-serif; margin: 0; background: #f5f6f7; color: #1a1a1a; font-size: 15px; }
  header { background: var(--verde); color: white; padding: 16px; padding-top: calc(16px + env(safe-area-inset-top));
           padding-left: calc(16px + env(safe-area-inset-left)); padding-right: calc(16px + env(safe-area-inset-right)); }
  /* Franja verde fija bajo la barra de estado del iPhone (app a pantalla completa). */
  body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top); background: var(--verde); z-index: 5; }
  .cab-acciones { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 8px 0 6px; }
  .cab-acciones button { border: 1px solid #fff; background: #fff; color: var(--verde); font-weight: 700; border-radius: 999px;
                         padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .cab-acciones button:disabled { opacity: .7; }
  #msgPlanilla { font-size: 13px; font-weight: 600; }
  .sin-red { background: #fff4cc; color: #6b5200; border-radius: 6px; padding: 2px 6px; font-weight: 600; }
  header h1 { margin: 0; font-size: 19px; }
  header .sub { font-size: 14px; opacity: .92; margin-top: 4px; }
  header a { color: white; font-size: 13px; }
  nav { position: sticky; top: env(safe-area-inset-top); z-index: 3; background: white; border-bottom: 1px solid var(--borde);
        display: flex; gap: 6px; overflow-x: auto; padding: 8px 12px; }
  nav a { flex: none; text-decoration: none; color: var(--verde); font-weight: 600; font-size: 13px;
          border: 1px solid #cfe0d1; border-radius: 999px; padding: 5px 11px; background: var(--verde-f); }
  main { max-width: 820px; margin: 0 auto; padding: 12px; }
  section { background: white; border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 14px;
            padding: 12px 14px; scroll-margin-top: 56px; }
  h2 { font-size: 17px; color: var(--verde); margin: 2px 0 10px; }
  .tarjetas { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
  .tarjeta { background: var(--verde-f); border-left: 4px solid var(--verde); padding: 8px 10px; }
  .tarjeta b { display: block; font-size: 20px; color: var(--verde); }
  .tarjeta span { font-size: 12px; color: var(--gris); }
  .estim { color: var(--rojo); }
  .alerta { background: var(--rojo-f); border-left: 4px solid var(--rojo); padding: 8px 10px; margin: 6px 0; font-size: 14px; }
  .nota { font-size: 12px; color: var(--gris); margin: 8px 0 0; }
  details { border-top: 1px solid var(--borde); }
  details:first-of-type { border-top: 0; }
  summary { cursor: pointer; list-style: none; padding: 10px 2px; display: flex; gap: 10px; align-items: baseline; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸"; color: #888; flex: none; transition: transform .15s; }
  details[open] > summary::before { transform: rotate(90deg); }
  summary .tit { flex: 1; min-width: 0; }
  summary .tit small { display: block; color: var(--gris); font-size: 12px; margin-top: 2px; }
  summary .cif { flex: none; text-align: right; font-variant-numeric: tabular-nums; font-size: 14px; }
  summary .cif small { display: block; color: var(--gris); font-size: 12px; }
  .dentro { padding: 0 0 10px 20px; }
  .dentro details summary { padding: 8px 2px; font-size: 14px; }
  .sin-geo > summary { background: var(--rojo-f); }
  .grupo { font-size: 12px; font-weight: 700; color: var(--verde); text-transform: uppercase; letter-spacing: .03em;
           margin: 12px 0 2px; }
  .tabla { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 7px 6px; text-align: left; border-bottom: 1px solid #eee; vertical-align: top; }
  th { background: #eef1ee; font-size: 12px; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tfoot td { font-weight: 700; background: #eef1ee; }
  .barra { display: inline-block; height: 8px; background: var(--verde); vertical-align: middle; margin-left: 6px; }
  ol.visitas { margin: 4px 0 6px; padding-left: 20px; font-size: 14px; }
  ol.visitas li { margin: 5px 0; }
  ol.visitas .hora { font-variant-numeric: tabular-nums; color: var(--gris); }
  a { color: var(--verde); }
  .vacio { color: var(--gris); padding: 8px 0; }
  @media (max-width: 520px) { body { font-size: 14px; } main { padding: 8px; } section { padding: 10px; }
    .ocm { display: none; } th, td { padding: 6px 4px; font-size: 13px; } td.dia { white-space: nowrap; } }

  .marca { display: inline-block; padding: 1px 7px; border-radius: 9px; font-size: 12px; font-weight: 700; }
  .m-ok { background: #e3f2e6; color: #1f6b34; } .m-sin_geocerca { background: #fff4cc; color: #8a6a00; }
  .m-confirmar { background: #fdecea; color: #b3261e; } .m-sin_senal { background: #eceeed; color: #5d6660; }
  .alerta-grande { background: #b3261e; color: #fff; padding: 12px 14px; border-radius: 10px; margin-bottom: 14px; }
  .alerta-grande b { font-size: 16px; }
  .filtros-op { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .filtros-op button, .acciones button { border: 1px solid #cfe0d1; background: var(--verde-f); color: var(--verde); font-weight: 600;
    border-radius: 999px; padding: 5px 11px; font-size: 13px; cursor: pointer; }
  .filtros-op button.activo { background: var(--verde); color: #fff; }
  .acciones { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .acciones button { border-radius: 6px; font-size: 12px; padding: 4px 8px; }
  .buscador { width: 100%; padding: 9px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; margin: 0 0 12px; }
  tr.fila-trabajo { cursor: pointer; } tr.fila-trabajo:hover td { background: #f6f8f6; }
  tr.detalle td { background: #fafbfa; font-size: 13px; }
  .aviso-planilla { color: #b3261e; font-weight: 700; margin: 6px 0; }
  .gps { font-size: 12px; color: var(--gris); margin-top: 3px; }
  .mensaje { font-size: 12px; font-weight: 600; margin-top: 3px; }
  .selector { display: inline-flex; flex-direction: column; gap: 2px; min-width: 210px; max-width: 100%; }
  .selector input, .selector select { padding: 4px; font-size: 13px; border: 1px solid #ccc; border-radius: 6px; width: 100%; }
  .tc-eq { color: var(--gris); font-weight: 400; }
  .est { display: inline-block; padding: 1px 7px; border-radius: 9px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .est-trabajo { background: #e3f2e6; color: #1f6b34; } .est-cyh { background: #fff4cc; color: #8a6a00; }
  .est-nada { background: #eceeed; color: #5d6660; } .est-senal { background: #fdecea; color: #b3261e; }
  .sube { color: #1f6b34; font-weight: 700; } .baja { color: #b3261e; font-weight: 700; } .igual { color: var(--gris); }
  .aprox { color: #8a6a00; font-size: 11px; font-weight: 600; }
  /* Celular: cada fila de tabla como tarjeta (sin mover hacia el lado). */
  @media (max-width: 600px) {
    .tabla { overflow-x: visible; }
    table.resp thead { display: none; }
    table.resp, table.resp tbody, table.resp tfoot, table.resp tr { display: block; width: 100%; }
    table.resp tr { border: 1px solid var(--borde); border-radius: 8px; margin: 0 0 8px; padding: 6px 10px; background: #fff; }
    table.resp tfoot tr { background: #eef1ee; }
    table.resp td { display: block; border: 0; padding: 3px 0; text-align: left; white-space: normal; }
    table.resp td.n { display: inline-block; min-width: 31%; margin-right: 6px; vertical-align: top; }
    table.resp td[data-label]:not([data-label=""])::before { content: attr(data-label); display: block; font-size: 11px;
      font-weight: 600; color: var(--gris); text-transform: uppercase; letter-spacing: .02em; }
    table.resp td:empty { display: none; }
    table.resp tr.detalle { background: #fafbfa; }
    table.resp td.grupo { margin: 0; }
    .selector { min-width: 0; width: 100%; }
  }
</style>
</head>
<body>
<header>
  <h1>Reporte diario de flota – C&amp;H Maquinaria</h1>
  <div class="sub" id="fecha">Cargando…</div>
  <div class="sub" id="estadoDatos"></div>
  <div class="cab-acciones"><button type="button" id="btnPlanilla" onclick="actualizarPlanilla(this)">Actualizar</button><a href="operacion.html" style="font-weight:700">Editar Operación →</a><span id="msgPlanilla"></span></div>
  <a href="index.html">← Hectáreas y Flota</a>
</header>
<nav aria-label="Secciones">
  <a href="#resumen">Resumen</a><a href="#maquinas-ayer">Máquinas ayer</a><a href="#camionetas">Camionetas</a>
  <a href="#camion">Camión</a><a href="operacion.html">Operación ✎</a><a href="#operacion">En operación</a><a href="#alertas">Alertas</a>
  <a href="#operadores">Operadores</a><a href="#trabajo-campo">Trabajo por campo</a><a href="#semana">7 días</a><a href="#equivalencias">Equivalencias</a>
</nav>
<main>
  <input class="buscador" id="buscador" type="search" placeholder="Buscar máquina o campo (ej. Tractor 16, Candelaria)">
  <div id="contenido"></div>
</main>
<script>
// Datos: docs/datos/reporte_v2.json (aparte del reporte_diario.json del correo diario; lo arma
// v2_manana.py despues del correo, y las confirmaciones y la planilla). Reglas en CLAUDE.md.
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const n = (v, d = 1) => Number(v || 0).toLocaleString('es-CL', { minimumFractionDigits: d, maximumFractionDigits: d });
const DIAS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const fc = iso => { const [a, m, d] = iso.split('-').map(Number); return `${DIAS[new Date(a, m - 1, d).getDay()]} ${String(d).padStart(2, '0')}-${String(m).padStart(2, '0')}`; };
const mapa = (url, txt = 'mapa') => url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${txt}</a>` : '';
const haTxt = (ha, sin) => (ha ? n(ha, 2) : (sin ? '' : '–')) + (sin ? ` <span class="estim">(~${n(sin)})</span>` : '');
const minTxt = m => m >= 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')} min` : `${m} min`;
const lugaresTxt = (lugares, sep) => lugares.map(l => l.tipo === 'campo' ? `<b>${esc(l.nombre)}</b>` : esc(l.nombre)).join(sep);

function seccionResumen(d) {
  const r = d.resumen, a = d.alertas;
  const senal = a.sin_senal.length ? a.sin_senal.map(x => `${esc(x.maquina)} (desde ${esc((x.ultima_conexion || '').slice(0, 5))}, ${esc(x.ubicacion || '')}) ${mapa(x.mapa)}`).join('; ') : 'ninguna';
  const sinGeo = a.sin_geocerca.length ? a.sin_geocerca.map(x => `${esc(x.maquina)} – ${n(x.horas)} h (~${n(x.ha)} ha) ${mapa(x.mapa)}`).join('; ') : 'ninguno';
  return `<section id="resumen"><h2>Resumen de ayer (${esc(d.fecha_texto)})</h2>
    <div class="tarjetas">
      <div class="tarjeta"><b>${r.maquinas} de ${r.total_maquinas}</b><span>máquinas trabajaron</span></div>
      <div class="tarjeta"><b>${n(r.ha, 2)} ha</b><span>en geocercas${r.ha_sin ? ` <span class="estim">+ ~${n(r.ha_sin)} ha sin geocerca</span>` : ''}</span></div>
      <div class="tarjeta"><b>${n(r.horas)} h</b><span>de las máquinas</span></div>
      <div class="tarjeta"><b>${n(r.km_camionetas, 0)} km</b><span>camionetas (${r.camionetas_movidas} de ${r.total_camionetas} se movieron)</span></div>
      <div class="tarjeta"><b>${n(r.km_camion, 0)} km</b><span>camión</span></div>
    </div>
    <div class="alerta"><b>GPS sin señal:</b> ${senal}</div>
    <div class="alerta"><b>Trabajo sin geocerca ayer:</b> ${sinGeo}</div>
    <p class="nota">No trabajaron ayer: ${r.no_trabajaron} máquinas — ${r.en_cyh} en CYH, ${r.detenidas_fuera} detenidas fuera de CYH y ${r.sin_senal_30} sin señal hace más de 30 días (<a href="index.html#flota">ver en Flota</a>).</p>
  </section>`;
}

function seccionMaquinas(d) {
  let html = '', grupo = null;
  for (const m of d.maquinas) {
    if (m.grupo !== grupo) { grupo = m.grupo; html += `<div class="grupo">${esc(grupo)}</div>`; }
    const conSin = m.ha_sin > 0;
    const dias = m.dias.slice().reverse().map(x => {
      const lugares = x.lugares.map(l => `${esc(l.geocerca)} (${n(l.horas)} h)`);
      if (x.sin.length) lugares.push(`<span class="estim">sin geocerca ${n(x.horas_sin)} h</span> ${x.sin.map(s => mapa(s.mapa)).join(' ')}`);
      return `<tr><td>${fc(x.fecha)}</td><td>${lugares.join('<br>') || '–'}</td><td class="n">${haTxt(x.ha, x.ha_sin)}</td><td class="n">${n(x.horas)}</td></tr>`;
    }).join('');
    html += `<details class="${conSin ? 'sin-geo' : ''}"><summary><span class="tit">${esc(m.nombre)}<small>${esc(m.labor)} · ${m.dias_trabajo} día${m.dias_trabajo === 1 ? '' : 's'}</small></span>
      <span class="cif">${haTxt(m.ha, m.ha_sin)} ha<small>${n(m.horas)} h</small></span></summary>
      <div class="dentro"><table><thead><tr><th>Día</th><th>Dónde trabajó</th><th class="n">Ha</th><th class="n">Horas</th></tr></thead><tbody>${dias}</tbody></table>
      ${conSin && m.rendimiento ? `<p class="nota">Ha sin geocerca estimadas con su rendimiento real: ${n(m.rendimiento, 2)} ha/h.</p>` : ''}</div></details>`;
  }
  return `<section id="maquinas"><h2>Máquinas · últimos 7 días</h2>${html || '<p class="vacio">Sin trabajo.</p>'}
    <p class="nota">Entre paréntesis y en rojo, las hectáreas estimadas sin geocerca (horas × rendimiento real de la máquina en sus cuarteles con geocerca).</p></section>`;
}

function diaVehiculo(x, recorrido) {
  if (!x.se_movio) return `<details><summary><span class="tit">${fc(x.fecha)} · 0 km<small>No se movió${x.donde_quedo ? ' · en ' + esc(x.donde_quedo) : ''}</small></span></summary></details>`;
  const visitas = x.visitas.map(v => `<li><span class="hora">${esc(v.llegada)}</span> ${v.tipo === 'campo' ? `<b>${esc(v.nombre)}</b>${v.detalle && v.detalle !== v.nombre ? ` (${esc(v.detalle)})` : ''}` : esc(v.nombre)} · ${minTxt(v.minutos)} ${mapa(v.mapa)}</li>`).join('');
  return `<details><summary><span class="tit">${fc(x.fecha)} · ${n(x.km)} km · ${esc(x.salida || '')}–${esc(x.llegada || '')}<small>${lugaresTxt(x.lugares, recorrido ? ' → ' : ' · ') || 'camino'}</small></span></summary>
    <div class="dentro"><ol class="visitas">${visitas || '<li>Solo camino (sin paradas largas).</li>'}</ol></div></details>`;
}

function seccionVehiculos(id, titulo, lista, recorrido) {
  const html = lista.map(v => `<details><summary><span class="tit">${esc(v.nombre)}<small>${v.dias_movimiento} día${v.dias_movimiento === 1 ? '' : 's'} con movimiento</small></span>
      <span class="cif">${n(v.km)} km</span></summary><div class="dentro">${v.dias.slice().reverse().map(x => diaVehiculo(x, recorrido)).join('')}</div></details>`).join('');
  const total = lista.reduce((t, v) => t + v.km, 0);
  return `<section id="${id}"><h2>${titulo} · últimos 7 días</h2>${html}
    <p class="nota">Total: <b>${n(total)} km</b>. Al tocar un día: los lugares en orden, con hora de llegada, tiempo ahí y mapa. En negrita, los campos (geocercas); en texto normal, las comunas donde se detuvo 15 min o más.</p></section>`;
}

function seccionSemana(d) {
  const max = Math.max(...d.semana.map(x => x.ha), 0);
  const filas = d.semana.map(x => `<tr><td class="dia">${fc(x.fecha)}</td><td class="n">${x.maquinas}</td><td class="n">${n(x.ha, 2)}${x.ha_sin ? `<br><span class="estim">~${n(x.ha_sin)}</span>` : ''}${max ? `<span class="barra ocm" style="width:${Math.round(40 * x.ha / max)}px"></span>` : ''}</td><td class="n">${n(x.horas)}</td><td class="n">${n(x.km_camionetas, 0)}</td><td class="n">${n(x.km_camion, 0)}</td></tr>`).join('');
  const s = k => d.semana.reduce((t, x) => t + x[k], 0);
  const campos = d.campos.map(c => `<tr><td>${esc(c.campo)}</td><td>${esc(c.labores.join(', '))}</td><td class="n">${n(c.ha, 2)}</td><td class="n">${c.terminados}</td></tr>`).join('');
  return `<section id="semana"><h2>Últimos 7 días</h2>
    <div class="tarjetas">
      <div class="tarjeta"><b>${n(s('ha'), 2)} ha</b><span>en geocercas${s('ha_sin') ? ` <span class="estim">+ ~${n(s('ha_sin'))} ha sin geocerca</span>` : ''}</span></div>
      <div class="tarjeta"><b>${n(s('horas'))} h</b><span>de las máquinas</span></div>
      <div class="tarjeta"><b>${n(s('km_camionetas'), 0)} km</b><span>camionetas</span></div>
      <div class="tarjeta"><b>${n(s('km_camion'), 0)} km</b><span>camión</span></div>
    </div>
    <div class="tabla"><table style="margin-top:10px"><thead><tr><th>Día</th><th class="n">Máq.</th><th class="n">Ha</th><th class="n">Horas</th><th class="n">Km<br>cam.</th><th class="n">Km<br>camión</th></tr></thead>
      <tbody>${filas}</tbody><tfoot><tr><td>Total</td><td></td><td class="n">${haTxt(s('ha'), s('ha_sin'))}</td><td class="n">${n(s('horas'))}</td><td class="n">${n(s('km_camionetas'), 0)}</td><td class="n">${n(s('km_camion'), 0)}</td></tr></tfoot></table></div>
    ${campos ? `<details style="margin-top:8px"><summary><span class="tit">Avance por campo</span></summary><div class="dentro"><table><thead><tr><th>Campo</th><th>Labores</th><th class="n">Ha</th><th class="n">Terminados</th></tr></thead><tbody>${campos}</tbody></table></div></details>` : ''}
  </section>`;
}

function seccionSinGeocerca(d) {
  const html = d.sin_geocerca.map(g => {
    const rango = g.desde === g.hasta ? fc(g.desde) : `${fc(g.desde)} a ${fc(g.hasta)}`;
    const dias = g.dias.map(x => `<tr><td>${fc(x.fecha)}</td><td>${esc(x.maquina)}</td><td class="n">${n(x.horas)}</td><td class="n">~${n(x.ha)}</td><td>${mapa(x.mapa)}</td></tr>`).join('');
    return `<details class="sin-geo"><summary><span class="tit">${esc(g.lugar)}<small>${g.cerca ? `cerca de ${esc(g.cerca[0])} (${n(g.cerca[1])} km) · ` : ''}${rango} · ${g.n_dias} día${g.n_dias === 1 ? '' : 's'}</small></span>
      <span class="cif">~${n(g.ha)} ha<small>${n(g.horas)} h</small></span></summary>
      <div class="dentro"><table><thead><tr><th>Día</th><th>Máquina</th><th class="n">Horas</th><th class="n">Ha</th><th></th></tr></thead><tbody>${dias}</tbody></table></div></details>`;
  }).join('');
  const tot = k => d.sin_geocerca.reduce((t, g) => t + g[k], 0);
  return `<section id="sin-geocerca"><h2>Trabajo sin geocerca · últimos 7 días</h2>${html || '<p class="vacio">Sin trabajo fuera de geocercas.</p>'}
    ${html ? `<p class="nota">${d.sin_geocerca.length} lugares · ${n(tot('horas'))} h · ~${n(tot('ha'))} ha estimadas. Trabajo real en campos sin geocerca en Wialon: al crear la geocerca esas hectáreas se recuperan.</p>` : ''}</section>`;
}


// ---------------------------------------------------------------------------
// Version nueva (CLAUDE.md "Correo y pagina v2"): cruce con la planilla
// "Maquinas en Operacion" del Drive. Datos: reporte_v2.json -> v2.
// ---------------------------------------------------------------------------
let D = null, V = null, filtroOp = 'todas', CAMPOS = { campos: [], equivalencias: {} }, REGISTRO = [];
// Fuente de maquinas y operadores: la pagina Operacion desde el 26-oct-2026 (antes la planilla del Drive).
const FUENTE = () => (V && V.fuente === 'operacion') ? 'Operación' : 'Planilla';
const sinT = t => String(t || '').normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase();
const coincide = (...textos) => { const q = sinT(document.getElementById('buscador').value.trim()); return !q || textos.some(t => sinT(t).includes(q)); };
const marcaHtml = (estado, texto) => `<span class="marca m-${estado}">${estado === 'ok' ? '✓ ' : ''}${esc(texto)}</span>`;

// Mensaje junto al boton, dentro de la pagina (sin ventanas emergentes).
function mensaje(boton, texto, error) {
  const caja = boton.closest('.acciones') || boton.parentElement;
  let m = caja.nextElementSibling;
  if (!m || !m.classList.contains('mensaje')) { caja.insertAdjacentHTML('afterend', '<div class="mensaje"></div>'); m = caja.nextElementSibling; }
  m.textContent = texto;
  m.style.color = error ? 'var(--rojo)' : 'var(--verde)';
}

function confirmar(cuerpo, boton) {
  const base = V.url_confirmar;
  // El Worker solo recibe en /confirmar.
  const url = base && (/\/confirmar\/?$/.test(base) ? base : base.replace(/\/+$/, '') + '/confirmar');
  if (!url) { mensaje(boton, 'Todavía no se puede guardar: falta configurar el Worker de Cloudflare.', true); return; }
  boton.disabled = true;
  mensaje(boton, 'Guardando…', false);
  enviarConPin(url, cuerpo, boton)
    .then(res => {
      const ok = res.ok;
      mensaje(boton, ok ? 'Confirmado, se verá en unos minutos.' : textoError(res), !ok);
      if (!ok) { boton.disabled = false; return; }
      // Para no apretar dos veces: se bloquean los botones de esa fila y se recuerda 15 min.
      (boton.closest('td') || boton.parentElement).querySelectorAll('button').forEach(b => b.disabled = true);
      const fila = boton.closest('[data-maquina]');
      if (fila) { try { localStorage.setItem('conf:' + fila.dataset.maquina, String(Date.now())); } catch (e) {} }
    })
    .catch(() => { boton.disabled = false; mensaje(boton, 'No se pudo conectar con el Worker de Cloudflare.', true); });
}

// Mismo nombre sin importar mayusculas, tildes, espacios ni signos.
const mismoNombre = (a, b) => sinT(a).replace(/[^a-z0-9]/g, '') === sinT(b).replace(/[^a-z0-9]/g, '');
// Confirmado hace menos de 15 min (en este navegador): la fila espera los datos nuevos.
// Deja de esperar cuando los datos publicados son posteriores a la confirmacion (V.actualizado).
function recienConfirmada(maquina) {
  let t = 0;
  try { t = Number(localStorage.getItem('conf:' + maquina)) || 0; } catch (e) { return false; }
  if (!t || Date.now() - t > 15 * 60 * 1000) return false;
  const a = /^(\d\d)-(\d\d)-(\d{4}) (\d\d):(\d\d)$/.exec((V && V.actualizado) || '');
  const datos = a ? new Date(`${a[3]}-${a[2]}-${a[1]}T${a[4]}:${a[5]}:59-03:00`).getTime() : 0;
  return datos < t;
}

// 3. Lista desplegable con buscador de campos de Wialon (con sus equivalentes).
// Nombre limpio del campo para mostrar (campos.json -> nombres_lista); el valor
// que se guarda sigue siendo el nombre interno.
const nombreCampo = c => (CAMPOS.nombres && CAMPOS.nombres[c]) || c;
function opcionesCampos(filtro) {
  const q = sinT(filtro || '');
  const eq = CAMPOS.equivalencias || {};
  return CAMPOS.campos.filter(c => !CAMPOS.nombres || CAMPOS.nombres[c]).map(c => {
    const otros = Object.keys(eq).filter(k => (eq[k] || []).includes(c));
    return { valor: c, texto: nombreCampo(c) + (otros.length ? ` (= ${otros.join(', ')})` : ''), interno: c };
  }).sort((a, b) => a.texto.localeCompare(b.texto, 'es'))
    .filter(o => !q || sinT(o.texto).includes(q) || sinT(o.interno).includes(q));
}
function selectorCampo(clase) {
  const ops = opcionesCampos('').map(o => `<option value="${esc(o.valor)}">${esc(o.texto)}</option>`).join('');
  return `<span class="selector ${clase || ''}"><input type="search" placeholder="Buscar campo" oninput="filtrarSelector(this)">` +
    `<select size="5">${ops}</select></span>`;
}
function filtrarSelector(entrada) {
  const sel = entrada.nextElementSibling;
  sel.innerHTML = opcionesCampos(entrada.value).map(o => `<option value="${esc(o.valor)}">${esc(o.texto)}</option>`).join('');
  if (sel.options.length) sel.selectedIndex = 0;
}
function confirmarElegido(boton, cuerpo) {
  const sel = boton.closest('.acciones').querySelector('.selector select');
  const campo = sel && sel.value;
  if (!campo) { mensaje(boton, 'Elige un campo de la lista.', true); return; }
  confirmar({ ...cuerpo, campo }, boton);
}
const btn = (texto, cuerpo) => `<button type="button" onclick='confirmar(JSON.parse(this.dataset.c), this)' data-c="${esc(JSON.stringify(cuerpo))}">${esc(texto)}</button>`;

function accionesOperacion(f) {
  if (recienConfirmada(f.maquina)) return '<div class="mensaje" style="color:var(--verde)">Confirmado, se verá en unos minutos.</div>';
  const enTaller = !f.campo_planilla || sinT(f.campo_planilla) === 'taller';
  if (f.estado === 'confirmar') {
    const base = { accion: 'maquina', maquina: f.maquina, planilla: f.campo_planilla };
    const mismo = (!enTaller && f.gps && f.gps !== 'CYH' && f.gps !== 'fuera de geocercas' && !mismoNombre(f.campo_planilla, f.gps))
      ? btn(`Es el mismo campo (${f.campo_planilla} = ${f.gps})`, { accion: 'equivalencia', planilla: f.campo_planilla, campo: f.gps }) : '';
    return `<div class="acciones">${btn(enTaller ? 'Está en CYH (GPS con falla)' : 'Está en CYH', { ...base, valor: 'cyh' })}` +
      `${btn(enTaller ? 'Está en el campo' : 'Está en el campo (GPS con falla)', { ...base, valor: enTaller ? 'campo: ' + (f.gps || '') : 'campo' })}${mismo}</div>`;
  }
  if (f.estado === 'sin_geocerca' && f.lat && f.campo_planilla) {
    // Si la planilla ya tiene su campo de Wialon, un boton; si no, elegirlo de la lista
    // (y si el nombre es distinto queda guardada la equivalencia).
    if (f.campos_wialon && f.campos_wialon.length) {
      return `<div class="acciones">${f.campos_wialon.map(c => btn('Confirmar: es ' + nombreCampo(c), { accion: 'campo', lat: f.lat, lon: f.lon, campo: c, planilla: f.campo_planilla })).join('')}</div>` +
        `<div class="acciones">${selectorCampo()}<button type="button" onclick='confirmarElegido(this, ${esc(JSON.stringify({ accion: 'campo', lat: f.lat, lon: f.lon, planilla: f.campo_planilla }))})'>Es otro campo</button></div>`;
    }
    return `<div class="acciones">${selectorCampo()}` +
      `<button type="button" onclick='confirmarElegido(this, ${esc(JSON.stringify({ accion: 'campo', lat: f.lat, lon: f.lon, planilla: f.campo_planilla }))})'>Confirmar campo elegido</button>` +
      `${btn('Sigue sin geocerca: ' + f.campo_planilla, { accion: 'campo', lat: f.lat, lon: f.lon, campo: f.campo_planilla })}</div>`;
  }
  return '';
}

  const grande = v.alerta_grande.length ? `<div class="alerta-grande"><b>⚠ Máquinas en campo sin señal GPS (más de 15 días)</b><br>${v.alerta_grande.map(a => `${esc(a.maquina)} – planilla: ${esc(a.campo_planilla)} · sin señal hace ${a.dias_sin_senal} días ${mapa(a.mapa)}`).join('<br>')}</div>` : '';

      <div class="tarjeta"><b>${n(r.ha, 2)} ha</b><span>en geocercas${r.ha_sin ? ` <span class="estim">+ ~${n(r.ha_sin)} ha sin geocerca</span>` : ''}</span></div>
      <div class="tarjeta"><b>${n(r.horas)} h</b><span>de las máquinas</span></div>
      <div class="tarjeta"><b>${n(r.km_camionetas, 0)} km</b><span>camionetas · ${n(r.km_camion, 0)} km camión</span></div>
    </div></section>
    <section id="maquinas-ayer"><h2>Máquinas que trabajaron ayer</h2><div class="tabla"><table>
    <thead><tr><th>Máquina</th><th>Labor</th><th>Operador</th><th>Dónde</th><th class="n">Horas</th><th class="n">Ha</th></tr></thead>
    <tbody>${filas || '<tr><td colspan="6" class="vacio">Ninguna.</td></tr>'}</tbody>
    <tfoot><tr><td colspan="4">Total (sin las que no son de CYH)</td><td class="n">${n(nuestras.reduce((t, m) => t + m.horas, 0))}</td><td class="n">${haTxt(nuestras.reduce((t, m) => t + m.ha, 0), nuestras.reduce((t, m) => t + m.ha_sin, 0))}</td></tr></tfoot></table></div></section>`;
}

function seccionOperacion() {
  const v = V;
  const pasa = f => filtroOp === 'todas' || (filtroOp === 'ayer' && f.ayer_trabajo) || (filtroOp === 'nocalzan' && f.estado === 'confirmar') || (filtroOp === 'singeo' && f.estado === 'sin_geocerca');
  let html = '';
  if (filtroOp !== 'apagado') {
    const filas = v.operacion.filter(f => pasa(f) && coincide(f.maquina, f.campo_planilla, f.operador, f.gps)).map(f =>
      `<tr data-maquina="${esc(f.maquina)}"><td>${esc(f.maquina)}<br><small>${esc(f.labor)}</small></td><td>${esc(f.operador || '–')}</td>` +
      `<td>${FUENTE()}: <b>${esc(f.campo_planilla || 'Taller')}</b><br>${marcaHtml(f.estado, f.texto)}` +
      `${f.sin_operador ? ` <span class="marca m-confirmar">Sin operador en la ${FUENTE().toLowerCase()}</span>` : ''}` +
      `<div class="gps">GPS: ${esc(f.gps_texto || f.gps || '')} ${mapa(f.mapa)}</div>${accionesOperacion(f)}</td>` +
      `<td class="n">${f.promedio ? n(f.promedio, 2) : '–'}</td><td class="n">${f.ayer_ha ? '<b>' + n(f.ayer_ha, 2) + '</b>' : '–'}</td><td>${mapa(f.mapa)}</td></tr>`).join('');
    html += `<div class="tabla"><table><thead><tr><th>Máquina</th><th>Operador</th><th>Campo (${FUENTE().toLowerCase()})</th><th class="n">Prom. ha/día</th><th class="n">Ayer ha</th><th></th></tr></thead><tbody>${filas || '<tr><td colspan="6" class="vacio">Sin máquinas para este filtro.</td></tr>'}</tbody></table></div>`;
    html += v.avisos_planilla.map(a => `<div class="aviso-planilla">${esc(a)}</div>`).join('');
    if (filtroOp === 'todas' && v.no_en_planilla.length) html += `<h3 class="grupo" style="color:var(--rojo)">Fuera de CYH y no está en la ${FUENTE().toLowerCase()}</h3>` +
      v.no_en_planilla.filter(x => coincide(x.maquina)).map(x => `<div>${esc(x.maquina)} · GPS: ${esc(x.gps_texto || x.texto)}${x.no_cyh ? ' · <b style="color:var(--rojo)">No es de CYH (por revisar)</b>' : ''} ${mapa(x.mapa)}</div>`).join('');
  }
  if (filtroOp === 'todas' || filtroOp === 'apagado') html += `<h3 class="grupo">GPS apagado hace más de 30 días</h3>` +
    v.gps_apagado.filter(x => coincide(x.maquina)).map(x => `<div>${esc(x.maquina)} · ${x.dias_sin_senal} días ${mapa(x.mapa)}</div>`).join('');
  const b = (k, t) => `<button type="button" class="${filtroOp === k ? 'activo' : ''}" onclick="filtroOp='${k}'; dibujar()">${t}</button>`;
  return `<section id="operacion"><h2>Máquinas en operación (fuera de CYH)</h2>
    <div class="filtros-op">${b('todas', 'Todas')}${b('ayer', 'Trabajaron ayer')}${b('nocalzan', 'No calzan')}${b('singeo', 'Sin geocerca')}${b('apagado', 'GPS apagado')}</div>
    ${html}<p class="nota">✓ = el GPS calza con el campo de la ${FUENTE().toLowerCase()} (o su equivalente). "Confirmar": el GPS no calza; lo confirmado aparece como "Actualizar ${FUENTE().toLowerCase()}" hasta que se corrija en la página <a href="operacion.html">Operación</a>.</p></section>`;
}

function seccionAlertasV2(d) {
  const a = d.alertas;

}

// Trabajo de las maquinas por campo (temporada), pedido del usuario 22-oct-2026:
// "Ver por: Campo | Maquina" + buscador; todo cerrado de entrada.
// TC.abiertos guarda lo desplegado para no perderlo al volver a dibujar.
const TC = { modo: 'campo', q: '', abiertos: new Set() };
document.addEventListener('toggle', ev => {
  const k = ev.target && ev.target.dataset && ev.target.dataset.tc;
  if (k) { if (ev.target.open) TC.abiertos.add(k); else TC.abiertos.delete(k); }
}, true);
const abierto = k => TC.abiertos.has(k) ? ' open' : '';
const areaTC = (ha, sin) => (sin ? '~' : '') + n(ha + sin, 1) + ' ha';
const ayerTC = (ha, sin) => (ha + sin) ? `ayer <b style="color:var(--verde)">${sin ? '~' : ''}${n(ha + sin, 2)}</b>` : 'ayer –';
const diasTxt = k => `${k} día${k === 1 ? '' : 's'}`;
// Nombres de la planilla que equivalen a un campo de Wialon (ej. Siracusa -> Aurora).
const equivalentes = campo => Object.keys(CAMPOS.equivalencias || {}).filter(k => (CAMPOS.equivalencias[k] || []).includes(campo));
// Maquina por texto: los numeros deben calzar enteros ("10" = Tractor 10, no Tractor 1).
function calzaMaquina(nombre, q) {
  const nums = (nombre.match(/\d+/g) || []);
  return sinT(q).split(/\s+/).filter(Boolean).every(t => /^\d+$/.test(t) ? nums.includes(t) : sinT(nombre).includes(t));
}

function detalleTC(f) {
  const filas = f.detalle.map(d => `<tr class="detalle"><td>${fc(d.fecha)}</td><td>${d.cuarteles.map(c => `${esc(c.cuartel)} ${n(c.ha, 2)} ha`).join('<br>')}` +
    `${d.sin ? `${d.cuarteles.length ? '<br>' : ''}<span class="estim">sin geocerca ~${n(d.sin)} ha</span>` : ''}</td><td class="n">${d.horas ? n(d.horas) + ' h' : '–'}</td></tr>`).join('');
  return `<table><thead><tr><th>Día</th><th>Cuarteles</th><th class="n">Horas</th></tr></thead><tbody>${filas}</tbody></table>`;
}
const filaTC = (k, titulo, sub, f) => `<details data-tc="${esc(k)}"${abierto(k)}><summary><span class="tit">${titulo}<small>${sub}</small></span>` +
  `<span class="cif">${areaTC(f.ha, f.ha_sin)}<small>${diasTxt(f.dias)} · ${n(f.promedio, 2)} ha/día · ${ayerTC(f.ayer_ha, f.ayer_sin)}</small></span></summary>` +
  `<div class="dentro">${detalleTC(f)}</div></details>`;

function listaPorCampo() {
  const q = sinT(TC.q.trim());
  const campos = new Map();
  for (const f of V.trabajo_campo) { if (!campos.has(f.campo)) campos.set(f.campo, []); campos.get(f.campo).push(f); }
  let lista = [...campos.entries()].map(([campo, filas]) => {
    const fechas = new Set(filas.flatMap(f => f.detalle.map(d => d.fecha)));
    return { campo, filas, eq: equivalentes(campo), ha: filas.reduce((t, f) => t + f.ha, 0), sin: filas.reduce((t, f) => t + f.ha_sin, 0),
             dias: fechas.size, maquinas: new Set(filas.map(f => f.maquina)).size };
  });
  if (q) lista = lista.filter(c => [c.campo, nombreCampo(c.campo), ...c.eq].some(t => sinT(t).includes(q)));
  lista.sort((a, b) => (b.ha + b.sin) - (a.ha + a.sin));
  if (!lista.length) return '<p class="vacio">Ningún campo con ese nombre.</p>';
  return lista.map(c => {
    const k = 'c:' + c.campo;
    const maquinas = c.filas.slice().sort((a, b) => (b.ha + b.ha_sin) - (a.ha + a.ha_sin))
      .map(f => filaTC(`cm:${c.campo}|${f.maquina}|${f.labor}`, esc(f.maquina), esc(f.labor), f)).join('');
    return `<details data-tc="${esc(k)}"${abierto(k)}><summary><span class="tit"><b>${esc(nombreCampo(c.campo))}</b>` +
      `${c.eq.length ? ` <span class="tc-eq">(= ${esc(c.eq.join(', '))})</span>` : ''}<small>${diasTxt(c.dias)} · ${c.maquinas} máquina${c.maquinas === 1 ? '' : 's'}</small></span>` +
      `<span class="cif">${areaTC(c.ha, c.sin)}</span></summary><div class="dentro">${maquinas}</div></details>`;
  }).join('');
}

function listaPorMaquina() {
  const q = TC.q.trim();
  const grupos = new Map();  // en el orden fijo de la flota (trabajo_campo ya viene ordenado)
  for (const f of V.trabajo_campo) {
    if (q && !calzaMaquina(f.maquina, q)) continue;
    if (!grupos.has(f.grupo)) grupos.set(f.grupo, new Map());
    const g = grupos.get(f.grupo);
    if (!g.has(f.maquina)) g.set(f.maquina, []);
    g.get(f.maquina).push(f);
  }
  if (!grupos.size) return '<p class="vacio">Ninguna máquina con ese nombre.</p>';
  const suma = (fs, k) => fs.reduce((t, f) => t + f[k], 0);
  return [...grupos.entries()].map(([grupo, maquinas]) => {
    const kg = 'g:' + grupo;
    const todas = [...maquinas.values()].flat();
    const lista = [...maquinas.entries()].map(([maquina, filas]) => {
      const km = 'm:' + maquina;
      const campos = filas.slice().sort((a, b) => (b.ha + b.ha_sin) - (a.ha + a.ha_sin))
        .map(f => filaTC(`mc:${maquina}|${f.campo}|${f.labor}`, `<b>${esc(nombreCampo(f.campo))}</b>`, esc(f.labor), f)).join('');
      return `<details data-tc="${esc(km)}"${abierto(km)}><summary><span class="tit">${esc(maquina)}<small>${esc([...new Set(filas.map(f => f.labor))].join(', '))} · ${filas.length} campo${filas.length === 1 ? '' : 's'}</small></span>` +
        `<span class="cif">${areaTC(suma(filas, 'ha'), suma(filas, 'ha_sin'))}<small>${ayerTC(suma(filas, 'ayer_ha'), suma(filas, 'ayer_sin'))}</small></span></summary>` +
        `<div class="dentro">${campos}</div></details>`;
    }).join('');
    return `<details data-tc="${esc(kg)}"${abierto(kg)}><summary><span class="tit"><b>${esc(grupo)}</b><small>${maquinas.size} máquina${maquinas.size === 1 ? '' : 's'}</small></span>` +
      `<span class="cif">${areaTC(suma(todas, 'ha'), suma(todas, 'ha_sin'))}</span></summary><div class="dentro">${lista}</div></details>`;
  }).join('');
}

// Al buscar se despliega lo encontrado: un solo campo, o los grupos y las maquinas
// (todas si se busco un numero, ej. "10"; si no, hasta 3).
function abrirBusqueda() {
  TC.abiertos = new Set();
  const q = TC.q.trim();
  if (!q) return;
  if (TC.modo === 'campo') {
    const qs = sinT(q);
    const campos = [...new Set(V.trabajo_campo.map(f => f.campo))].filter(c => [c, nombreCampo(c), ...equivalentes(c)].some(t => sinT(t).includes(qs)));
    if (campos.length === 1) TC.abiertos.add('c:' + campos[0]);
  } else {
    const filas = V.trabajo_campo.filter(f => calzaMaquina(f.maquina, q));
    filas.forEach(f => TC.abiertos.add('g:' + f.grupo));
    const maquinas = [...new Set(filas.map(f => f.maquina))];
    if (maquinas.length <= 3 || /\d/.test(q)) maquinas.forEach(m => TC.abiertos.add('m:' + m));
  }
}

function listaTC() { return TC.modo === 'campo' ? listaPorCampo() : listaPorMaquina(); }
function dibujarTC() {
  const caja = document.getElementById('tcLista');
  if (caja) { caja.innerHTML = listaTC(); tablasMovil(caja); }
}
function cambiarModoTC(modo) {
  TC.modo = modo; TC.q = ''; TC.abiertos = new Set();
  const sec = document.getElementById('trabajo-campo');
  sec.outerHTML = seccionTrabajoCampo();
  tablasMovil(document.getElementById('trabajo-campo'));
}

function seccionTrabajoCampo() {
  const b = (k, t) => `<button type="button" class="${TC.modo === k ? 'activo' : ''}" onclick="cambiarModoTC('${k}')">${t}</button>`;
  const ph = TC.modo === 'campo' ? 'Buscar campo (ej. Aurora, Siracusa)' : 'Buscar máquina (ej. 10, SBS 10, Tractor 4)';
  return `<section id="trabajo-campo"><h2>Trabajo de las máquinas por campo · temporada</h2>
    <div class="filtros-op"><span style="align-self:center;font-size:13px;color:var(--gris)">Ver por:</span>${b('campo', 'Campo')}${b('maquina', 'Máquina')}</div>
    <input class="buscador" id="tcBuscar" type="search" placeholder="${ph}" value="${esc(TC.q)}" oninput="TC.q = this.value; abrirBusqueda(); dibujarTC()">
    <div id="tcLista">${listaTC()}</div>
    <p class="nota">${TC.modo === 'campo' ? 'Toca un campo para ver sus máquinas y una máquina para su detalle por día y cuartel.' : 'Toca un tipo para ver sus máquinas, una máquina para sus campos y un campo para el detalle por día y cuartel.'}
    Con ~: incluye trabajo sin geocerca estimado. Temporada: poda y picado desde el 1 de abril; raleo desde el 1 de septiembre; las demás desde el 1 de enero.</p></section>`;
}

// Celular: cada celda lleva el titulo de su columna (las tablas se ven como tarjetas).
function tablasMovil(raiz) {
  if (!raiz) return;
  raiz.querySelectorAll('table').forEach(t => {
    t.classList.add('resp');
    const ths = [...t.querySelectorAll('thead th')].map(th => th.textContent.trim());
    t.querySelectorAll('tbody tr, tfoot tr').forEach(tr => {
      let i = 0;
      [...tr.cells].forEach(td => { if (!td.hasAttribute('data-label')) td.setAttribute('data-label', td.colSpan > 1 ? '' : (ths[i] || '')); i += td.colSpan; });
    });
  });
}

// ---------------------------------------------------------------------------
// Operadores (pedido del usuario 22-oct-2026). Datos: v2.operadores (operadores.py).
// ---------------------------------------------------------------------------
const OPS = { q: '' };
const claseEstado = e => ({ 'trabajó ayer': 'est-trabajo', 'en CYH': 'est-cyh', 'sin señal': 'est-senal' }[e] || 'est-nada');
// Flecha frente al promedio de todos (±5 % = igual).
function flecha(propio, todos) {
  if (propio == null || !todos) return '';
  const d = (propio - todos) / todos;
  if (Math.abs(d) <= 0.05) return ` <span class="igual">≈ ${n(todos, 2)}</span>`;
  return d > 0 ? ` <span class="sube">▲</span> <small>prom. ${n(todos, 2)}</small>` : ` <span class="baja">▼</span> <small>prom. ${n(todos, 2)}</small>`;
}
// Equivalencias de operadores por el mismo camino que las de campos (sin cambiar el Worker):
// planilla = "operador: <otro nombre>", campo = <nombre que queda>.
const btnOp = (texto, accion, nombre, otro, distinto) => btn(texto, { accion, planilla: (distinto ? 'operador-distinto: ' : 'operador: ') + nombre, campo: otro || '' });

function detalleOperador(o) {
  const labores = o.labores.map(l => {
    const t = l.promedio_todos || {};
    return `<tr><td><b>${esc(l.labor)}</b> ${esc(l.temporada)}${l.aproximado ? '<br><span class="aprox">≈ aproximado</span>' : ''}</td>` +
      `<td>${esc(l.maquinas.join(', '))}<br><small>${esc(l.campos.map(nombreCampo).join(', ') || '–')}</small></td>` +
      `<td class="n">${l.dias}</td><td class="n">${l.horas ? n(l.horas) : '–'}</td><td class="n">${n(l.ha, 2)}</td>` +
      `<td class="n">${l.ha_dia != null ? n(l.ha_dia, 2) : '–'}${flecha(l.ha_dia, t.ha_dia)}</td>` +
      `<td class="n">${l.ha_hora != null ? n(l.ha_hora, 2) : '–'}${flecha(l.ha_hora, t.ha_hora)}</td></tr>`;
  }).join('');
  const dias = o.ultimos.map(d => `<tr><td>${fc(d.fecha)}${d.exacto ? '' : ' <span class="aprox">≈</span>'}</td><td>${esc(d.maquina)}<br><small>${esc(d.labor)}</small></td>` +
    `<td>${d.cuarteles.length ? d.cuarteles.map(c => `${esc(c.cuartel)}${c.ha ? ' ' + n(c.ha, 2) + ' ha' : ''}`).join('<br>') : esc(d.campos.map(nombreCampo).join(', ') || '–')}</td>` +
    `<td class="n">${d.horas ? n(d.horas) : '–'}</td><td class="n">${d.ha ? n(d.ha, 2) : '–'}</td></tr>`).join('');
  return `<div class="dentro">
    ${o.otros_nombres.length ? `<p class="nota">También anotado como: ${esc(o.otros_nombres.join(', '))}</p>` : ''}
    ${labores ? `<div class="tabla"><table><thead><tr><th>Labor y temporada</th><th>Máquina y campo</th><th class="n">Días</th><th class="n">Horas</th><th class="n">Ha</th><th class="n">Ha/día</th><th class="n">Ha/hora</th></tr></thead><tbody>${labores}</tbody></table></div>`
               : '<p class="vacio">Todavía sin trabajo registrado con este operador.</p>'}
    ${dias ? `<h3 class="grupo">Últimos días</h3><div class="tabla"><table><thead><tr><th>Fecha</th><th>Máquina</th><th>Campo / cuarteles</th><th class="n">Horas</th><th class="n">Ha</th></tr></thead><tbody>${dias}</tbody></table></div>` : ''}
  </div>`;
}

function listaOperadores() {
  const v = V.operadores, q = sinT(OPS.q.trim());
  const lista = v.lista.filter(o => !q || [o.operador, ...o.otros_nombres, ...o.hoy.flatMap(h => [h.maquina, h.campo, h.nombre_planilla])].some(t => sinT(t).includes(q)));
  if (!lista.length) return '<p class="vacio">Ningún operador con ese nombre.</p>';
  return lista.map(o => {
    const k = 'op:' + o.operador;
    const hoy = o.hoy.length ? o.hoy.map(h => `${esc(h.maquina)}${h.implemento ? ' + ' + esc(h.implemento) : ''} · ${esc(h.campo || 'Taller')} <span class="est ${claseEstado(h.estado)}">${esc(h.estado)}</span>`).join('<br>')
                             : `<span class="est est-nada">no está hoy en la ${FUENTE().toLowerCase()}</span>`;
    return `<details data-tc="${esc(k)}"${abierto(k)}><summary><span class="tit"><b>${esc(o.operador)}</b><small>${hoy}</small></span></summary>${detalleOperador(o)}</details>`;
  }).join('');
}
function dibujarOperadores() {
  const caja = document.getElementById('opLista');
  if (caja) { caja.innerHTML = listaOperadores(); tablasMovil(caja); }
}

function seccionOperadores() {
  const v = V.operadores;
  if (!v) return '';
  const parecidos = (v.parecidos || []).map(p => `<div class="alerta">¿<b>${esc(p.nombre)}</b> es el mismo operador que <b>${esc(p.parecido_a)}</b>?
      <div class="acciones">${btnOp(`Sí, es ${p.parecido_a}`, 'equivalencia', p.nombre, p.parecido_a)}${btnOp('No, son distintos', 'equivalencia', p.nombre, p.parecido_a, true)}</div></div>`).join('');
  const sinOp = (v.sin_operador || []).map(x => `<div class="alerta"><b>Sin operador en la planilla:</b> ${esc(x.maquina)} trabajó ayer fuera de CYH (${esc(x.campo_planilla || '–')}). Ese trabajo queda en la máquina, sin operador.</div>`).join('');
  return `<section id="operadores"><h2>Operadores</h2>${sinOp}${parecidos}
    <input class="buscador" id="opBuscar" type="search" placeholder="Buscar operador, máquina o campo" value="${esc(OPS.q)}" oninput="OPS.q = this.value; dibujarOperadores()">
    <div id="opLista">${listaOperadores()}</div>
    <p class="nota">Promedios por labor y temporada, comparados con el promedio de todos los operadores en la misma labor y temporada (▲ más de 5 % sobre el promedio, ▼ más de 5 % bajo, ≈ parecido).
    Exacto desde el ${esc(v.desde_exacto ? fc(v.desde_exacto) : 'primer registro')} (lectura de la planilla); antes, <span class="aprox">≈ aproximado</span>: el operador actual durante la estadía actual de la máquina en el campo.
    Horas: las del tablero de la flota (últimos 30 días); sin horas, ha/hora queda en –.</p>
    ${seccionEquivOperadores()}</section>`;
}

function seccionEquivOperadores() {
  const v = V.operadores, eq = v.equivalencias || {};
  const fecha = {};
  for (const r of REGISTRO) if ((r.accion || '').includes('operador')) fecha[sinT(r.nombre) + '||' + sinT(r.operador || r.otro || '')] = r.fecha;
  const filas = Object.entries(eq).sort((a, b) => a[0].localeCompare(b[0])).flatMap(([k, otros]) => otros.map(o =>
    `<tr><td>${esc(o)}</td><td>${esc(k)}</td><td>${esc(fecha[sinT(o) + '||' + sinT(k)] || '–')}</td><td><div class="acciones">${btnOp('Quitar', 'borrar_equivalencia', o, k)}</div></td></tr>`)).join('');
  const nombres = [...new Set(v.lista.flatMap(o => [o.operador, ...o.otros_nombres, ...o.hoy.map(h => h.nombre_planilla)]))].sort();
  return `<h3 class="grupo" id="equivalencias-operadores">Equivalencias de operadores</h3>
    <div class="acciones" style="gap:8px;align-items:flex-start">
      <span class="selector"><input list="listaOperadores" id="eqOpNombre" placeholder="Nombre como aparece (ej. Carlos A)"></span>
      <span class="selector"><input list="listaOperadores" id="eqOpMismo" placeholder="Es el mismo que (ej. Carlos Ayala)"></span>
      <button type="button" onclick="guardarEquivOperador(this)">Guardar</button></div>
    <datalist id="listaOperadores">${nombres.map(x => `<option value="${esc(x)}">`).join('')}</datalist>
    <div class="tabla" style="margin-top:8px"><table><thead><tr><th>Nombre anotado</th><th>Es el mismo que</th><th>Fecha del cambio</th><th></th></tr></thead>
    <tbody>${filas || '<tr><td colspan="4" class="vacio">Sin equivalencias todavía.</td></tr>'}</tbody></table></div>`;
}
function guardarEquivOperador(boton) {
  const a = document.getElementById('eqOpNombre').value.trim(), b = document.getElementById('eqOpMismo').value.trim();
  if (!a || !b) { mensaje(boton, 'Escribe los dos nombres.', true); return; }
  if (mismoNombre(a, b)) { mensaje(boton, 'Es el mismo nombre: no hace falta una equivalencia.', true); return; }
  confirmar({ accion: 'equivalencia', planilla: 'operador: ' + a, campo: b }, boton);
}

// Equivalencias planilla -> Wialon (config.json, editables aqui; registro en confirmaciones.json).
function filasEquivalencias() {
  // Fecha de cada par: el ultimo cambio en el registro; las de la carga inicial, su fecha.
  const fecha = {};
  for (const r of REGISTRO) if ((r.accion || '').startsWith('equivalencia')) fecha[sinT(r.nombre) + '||' + r.campo] = r.fecha;
  const filas = [];
  for (const [k, v] of Object.entries(CAMPOS.equivalencias || {}).sort((a, b) => a[0].localeCompare(b[0]))) {
    if (!v.length) filas.push({ nombre: k, campo: '(sin geocerca por ahora)', fecha: fecha[sinT(k) + '||'] || 'carga inicial 22-10-2026' });
    for (const c of v) filas.push({ nombre: k, campo: c, fecha: fecha[sinT(k) + '||' + c] || 'carga inicial 22-10-2026' });
  }
  return filas;
}

function descargarEquivalencias(boton) {
  const filas = filasEquivalencias();
  const ir = () => {
    const hoja = XLSX.utils.aoa_to_sheet([['Nombre en planilla', 'Campo en Wialon', 'Fecha del cambio'], ...filas.map(f => [f.nombre, f.campo, f.fecha])]);
    hoja['!cols'] = [{ wch: 38 }, { wch: 30 }, { wch: 24 }];
    const libro = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(libro, hoja, 'Equivalencias');
    XLSX.writeFile(libro, `Equivalencias_de_campos_${new Date().toISOString().slice(0, 10)}.xlsx`);
    mensaje(boton, 'Descargado.', false);
  };
  if (window.XLSX) return ir();
  const sc = document.createElement('script');
  sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  sc.onload = ir; sc.onerror = () => mensaje(boton, 'No se pudo cargar el generador de Excel.', true);
  document.head.appendChild(sc);
}

// Equivalencias planilla -> Wialon (config.json, editables aqui; registro en confirmaciones.json).
function seccionEquivalencias() {
  const nombres = [...new Set([...Object.keys(CAMPOS.equivalencias || {}), ...V.operacion.map(f => f.campo_planilla).filter(c => c && sinT(c) !== 'taller')])].sort();
  const filas = filasEquivalencias().filter(f => coincide(f.nombre, f.campo)).map(f =>
    `<tr><td>${esc(f.nombre)}</td><td>${esc(nombreCampo(f.campo))}</td><td>${esc(f.fecha)}</td><td><div class="acciones">` +
    (f.campo.startsWith('(') ? btn('Borrar', { accion: 'borrar_equivalencia', planilla: f.nombre, campo: '' })
                             : btn('Quitar', { accion: 'borrar_equivalencia', planilla: f.nombre, campo: f.campo })) + '</div></td></tr>').join('');
  return `<section id="equivalencias"><h2>Equivalencias de campos (planilla → Wialon)</h2>
    <div class="acciones" style="gap:8px;align-items:flex-start">
      <span class="selector"><input list="listaNombres" id="eqNombre" placeholder="Nombre en la planilla"></span>
      ${selectorCampo('eqCampo')}
      <button type="button" onclick="guardarEquivalencia(this)">Guardar</button></div>
    <datalist id="listaNombres">${nombres.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
    <div class="acciones" style="margin-top:8px"><button type="button" onclick="descargarEquivalencias(this)">Descargar Excel</button></div>
    <div class="tabla" style="margin-top:8px"><table><thead><tr><th>Nombre en planilla</th><th>Campo en Wialon</th><th>Fecha del cambio</th><th></th></tr></thead><tbody>${filas}</tbody></table></div>
    <p class="nota">Un nombre puede tener varios campos. Al confirmar un campo en "Máquinas en operación" con un nombre distinto al de la planilla, la equivalencia se guarda sola.</p></section>`;
}

function guardarEquivalencia(boton) {
  const nombre = document.getElementById('eqNombre').value.trim();
  const sel = document.querySelector('.eqCampo select');
  const campo = sel && sel.value;
  if (!nombre) { mensaje(boton, 'Escribe o elige el nombre de la planilla.', true); return; }
  if (!campo) { mensaje(boton, 'Elige el campo de Wialon en la lista.', true); return; }
  if (mismoNombre(nombre, campo)) { mensaje(boton, 'Es el mismo nombre: no hace falta una equivalencia.', true); return; }
  confirmar({ accion: 'equivalencia', planilla: nombre, campo }, boton);
}

function dibujar() {
  const d = D;
  document.getElementById('contenido').innerHTML = seccionResumenV2(d)
    + seccionVehiculos('camionetas', 'Camionetas', d.camionetas, false) + seccionVehiculos('camion', 'Camión', d.camion, true)
    + seccionOperacion() + seccionOperadores() + seccionAlertasV2(d) + seccionTrabajoCampo() + seccionSemana(d) + seccionEquivalencias()
    + `<datalist id="listaCampos">${CAMPOS.campos.map(c => `<option value="${esc(c)}">`).join('')}</datalist>`;
  tablasMovil(document.getElementById('contenido'));
}

// ---------------------------------------------------------------------------
// Carga de datos. Abre rapido con lo guardado en el telefono (cache de la app,
// sw.js) y despues trae lo nuevo; sin senal muestra lo guardado con su fecha.
// Se actualiza sola al volver la conexion y cada 5 min con la app abierta.
// ---------------------------------------------------------------------------
const ARCHIVOS = ['datos/reporte_v2.json', 'datos/campos.json', 'datos/confirmaciones.json'];
const CACHE_DATOS = 'flota-datos-v2';
const WORKER = 'https://disparador-reporte.dawn-band-fd6c.workers.dev';
let firma = '', sinRed = false, planillaApi = '';
const vacio = i => i === 2 ? [] : {};

async function leerGuardado() {
  try {
    const c = await caches.open(CACHE_DATOS);
    const rs = await Promise.all(ARCHIVOS.map(u => c.match(new URL(u, location.href).href)));
    if (!rs[0]) return null;
    return await Promise.all(rs.map((r, i) => r ? r.json() : vacio(i)));
  } catch (e) { return null; }
}
async function leerRed() {
  const rs = await Promise.all(ARCHIVOS.map((u, i) => fetch(u, { cache: 'no-store' }).catch(e => { if (i === 0) throw e; return null; })));
  if (!rs[0].ok) throw new Error('sin datos');
  const guardado = rs[0].headers.get('X-Desde-Cache') === '1';  // sw.js sin red
  // La pagina tambien guarda lo que trae (en la primera visita sw.js aun no esta activo).
  if (!guardado) {
    try {
      const c = await caches.open(CACHE_DATOS);
      await Promise.all(rs.map((r, i) => r && r.ok ? c.put(new URL(ARCHIVOS[i], location.href).href, r.clone()) : null));
    } catch (e) { /* sin almacenamiento (navegacion privada): sigue sin guardar */ }
  }
  return { datos: await Promise.all(rs.map((r, i) => r && r.ok ? r.json() : vacio(i))), guardado };
}
function aplicar([d, c, reg]) {
  const v = d.v2 || {};
  const f = [d.generado, v.actualizado, v.planilla_leida, JSON.stringify(c.equivalencias || {}), (reg || []).length].join('|');
  if (f === firma) return;
  firma = f;
  D = d; V = d.v2; CAMPOS = { campos: c.campos || [], equivalencias: c.equivalencias || {}, nombres: c.nombres_lista || null }; REGISTRO = reg || [];
  document.getElementById('fecha').textContent = `Día reportado: ${d.fecha_texto}`;
  if (!V) { document.getElementById('contenido').innerHTML = '<section><p class="vacio">La versión nueva todavía no tiene datos publicados.</p></section>'; return; }
  const y = window.scrollY;
  dibujar();
  window.scrollTo(0, y);
}
// "dd-mm-aaaa HH:MM" (hora de Chile) -> "aaaa-mm-dd HH:MM" para comparar.
const ordenable = t => { const a = /^(\d\d)-(\d\d)-(\d{4}) (\d\d:\d\d)/.exec(t || ''); return a ? `${a[3]}-${a[2]}-${a[1]} ${a[4]}` : ''; };
const corta = t => { const a = /^(\d{4})-(\d\d)-(\d\d) (\d\d:\d\d)/.exec(t || ''); return a ? `${a[3]}-${a[2]} ${a[4]}` : ''; };
function mostrarEstado() {
  if (!D) return;
  const datos = ordenable((V && V.actualizado) || D.generado) || ordenable(D.generado);
  const planilla = [ordenable(V && V.planilla_leida), planillaApi].sort().pop();
  document.getElementById('estadoDatos').innerHTML = `Datos de ${esc(corta(datos))}` +
    (planilla ? ` · ${V && V.fuente === 'operacion' ? 'Actualizado' : 'Planilla leída'} a las ${esc(planilla.slice(11))}${planilla.slice(0, 10) !== datos.slice(0, 10) ? ' del ' + esc(corta(planilla).slice(0, 5)) : ''}` : '') +
    (sinRed ? ' · <span class="sin-red">sin conexión: se actualiza sola al volver la señal</span>' : '');
}
// Ultima lectura de la planilla aunque no haya cambiado (la revision sin cambios no sube nada):
// la ultima corrida terminada bien de planilla.yml (API publica de GitHub, solo lectura).
async function leerPlanillaApi() {
  try {
    const r = await fetch('https://api.github.com/repos/jpfernandez428/reporte-hectareas/actions/workflows/planilla.yml/runs?status=success&per_page=1', { cache: 'no-store' });
    const run = r.ok && (await r.json()).workflow_runs[0];
    if (!run) return;
    planillaApi = new Intl.DateTimeFormat('sv-SE', { timeZone: 'America/Santiago', year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date(run.updated_at)).replace(',', '');
  } catch (e) { /* sin red o limite de la API: queda la hora de los datos */ }
}
let cargando = false;
async function cargar(primera) {
  if (cargando) return;
  cargando = true;
  try {
    if (primera) { const g = await leerGuardado(); if (g) { sinRed = !navigator.onLine; aplicar(g); mostrarEstado(); } }
    try {
      const { datos, guardado } = await leerRed();
      sinRed = guardado || !navigator.onLine;
      aplicar(datos);
    } catch (e) {
      sinRed = true;
      if (!D) document.getElementById('contenido').innerHTML = '<section><p class="vacio">Sin conexión y sin datos guardados todavía. Se cargará al volver la señal.</p></section>';
    }
    if (!sinRed) await leerPlanillaApi();
    mostrarEstado();
    if (primera && location.hash) { const el = document.querySelector(location.hash); if (el) el.scrollIntoView(); }
  } finally { cargando = false; }
}

// Boton "Actualizar desde la planilla": el Worker lanza planilla.yml; la pagina
// revisa cada 30 s (hasta 6 min) si ya se leyo.
async function actualizarPlanilla(boton) {
  const msg = document.getElementById('msgPlanilla');
  const base = ((V && V.url_confirmar) || WORKER).replace(/\/confirmar\/?$/, '').replace(/\/+$/, '');
  boton.disabled = true;
  msg.textContent = 'Enviando…';
  const antes = [ordenable(V && V.planilla_leida), planillaApi].sort().pop() || '';
  try {
    const res = await enviarConPin(base + '/planilla', {}, boton);
    if (!res.ok) { boton.disabled = false; msg.textContent = textoError(res); return; }
  } catch (e) { boton.disabled = false; msg.textContent = 'No se pudo conectar con el Worker de Cloudflare.'; return; }
  msg.textContent = 'Actualizando, se verá en 2–3 minutos.';
  for (let i = 0; i < 12; i++) {
    await new Promise(r => setTimeout(r, 30000));
    await cargar(false);
    await leerPlanillaApi(); mostrarEstado();
    const ahora = [ordenable(V && V.planilla_leida), planillaApi].sort().pop() || '';
    if (ahora > antes) { msg.textContent = `Listo: actualizado a las ${ahora.slice(11)}.`; boton.disabled = false; return; }
  }
  msg.textContent = 'Todavía no termina; vuelve a mirar en unos minutos.';
  boton.disabled = false;
}

document.getElementById('buscador').addEventListener('input', () => { if (V) dibujar(); });
window.addEventListener('online', () => cargar(false));
window.addEventListener('offline', () => { sinRed = true; mostrarEstado(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') cargar(false); });
setInterval(() => { if (document.visibilityState === 'visible') cargar(false); }, 5 * 60 * 1000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
cargar(true);
</script>

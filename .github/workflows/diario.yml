name: Reporte diario de hectareas

on:
  # Corrida diaria automatica PAUSADA mientras se valida la formula nueva.
  # Para reactivarla, descomentar estas dos lineas:
  # schedule:
  #   - cron: '0 9 * * *'   # 09:00 UTC = ~06:00 Chile (horario de invierno)
  workflow_dispatch:
    inputs:
      fecha_inicio:
        description: 'Fecha inicio (AAAA-MM-DD). Dejar vacio para usar el dia de ayer.'
        required: false
        default: ''
      fecha_fin:
        description: 'Fecha fin (AAAA-MM-DD). Dejar vacio para usar el dia de ayer.'
        required: false
        default: ''
      diagnostico:
        description: 'Poner 1 para solo revisar Wialon (unidades y labores), sin calcular nada.'
        required: false
        default: ''
      prueba_pasadas:
        description: 'Con diagnostico=1: maquina o labor (ej. Barrido) para probar el conteo de pasadas.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  reporte:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar librerias
        run: pip install -r requirements.txt

      - name: Correr el programa
        env:
          WIALON_TOKEN: ${{ secrets.WIALON_TOKEN }}
          FECHA_INICIO_MANUAL: ${{ inputs.fecha_inicio }}
          FECHA_FIN_MANUAL: ${{ inputs.fecha_fin }}
          MODO_DIAGNOSTICO: ${{ inputs.diagnostico }}
          PRUEBA_PASADAS_UNIDAD: ${{ inputs.prueba_pasadas }}
          PRUEBA_DESDE: ${{ inputs.fecha_inicio }}
          PRUEBA_HASTA: ${{ inputs.fecha_fin }}
        run: python3 reporte_hectareas.py

      - name: Guardar los tramos de la prueba de pasadas (solo diagnostico)
        if: ${{ inputs.prueba_pasadas != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: tramos-diagnostico
          path: tramos_diagnostico.json
          retention-days: 7

      - name: Guardar los resultados en el repositorio
        run: |
          git config user.name "Reporte automatico"
          git config user.email "actions@users.noreply.github.com"
          git add memoria_hileras docs/datos
          git diff --staged --quiet || git commit -m "Actualizacion automatica $(date -u +%F)"
          git push

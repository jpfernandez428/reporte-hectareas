name: Reporte diario de hectareas

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC = ~02:00 Chile: corrida completa de hectareas
  workflow_dispatch:
    inputs:
      fecha_inicio:
        description: 'Fecha inicio (AAAA-MM-DD). Dejar vacio para usar el dia de ayer.'
        required: false
        default: ''
      fecha_fin:
        description: 'Fecha fin (AAAA-MM-DD). Dejar vacio para usar el dia de ayer.'
        required: false
        default: ''
      diagnostico:
        description: 'Poner 1 para solo revisar Wialon (unidades y labores), sin calcular nada.'
        required: false
        default: ''
      prueba_pasadas:
        description: 'Con diagnostico=1: maquina o labor (ej. Barrido) para probar el conteo de pasadas.'
        required: false
        default: ''
      prueba_estado:
        description: 'Con diagnostico=1: poner 1 para probar el panel de maquinas del dia fecha_fin.'
        required: false
        default: ''
      prueba_geocerca_nueva:
        description: 'Con diagnostico=1: nombre de una geocerca para simular que es nueva (30 dias hasta fecha_fin).'
        required: false
        default: ''
      prueba_casos:
        description: 'Con diagnostico=1: casos "maquina|AAAA-MM-DD|geocerca;..." para bajar su GPS.'
        required: false
        default: ''
      prueba_info_unidad:
        description: 'Con diagnostico=1: nombre de una maquina para ver su ficha en Wialon (id, IMEI, equipo).'
        required: false
        default: ''
      labores:
        description: 'Recalcular solo estas labores (ej. Poda,Picado,Barrido). Vacio = todas.'
        required: false
        default: ''
      recuperar_geocercas:
        description: 'Recuperar solo estas geocercas desde fecha_inicio, todas las labores (ej. Aurora, Avoamerica, Candelaria 5-12).'
        required: false
        default: ''

permissions:
  contents: write

# Una sola corrida a la vez que escriba en el repositorio (con la del tablero).
concurrency:
  group: datos-del-repositorio
  cancel-in-progress: false

jobs:
  reporte:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar librerias
        run: pip install -r requirements.txt

      - name: Correr el programa
        env:
          WIALON_TOKEN: ${{ secrets.WIALON_TOKEN }}
          FECHA_INICIO_MANUAL: ${{ inputs.fecha_inicio }}
          FECHA_FIN_MANUAL: ${{ inputs.fecha_fin }}
          MODO_DIAGNOSTICO: ${{ inputs.diagnostico }}
          PRUEBA_PASADAS_UNIDAD: ${{ inputs.prueba_pasadas }}
          PRUEBA_DESDE: ${{ inputs.fecha_inicio }}
          PRUEBA_HASTA: ${{ inputs.fecha_fin }}
          PRUEBA_ESTADO: ${{ inputs.prueba_estado }}
          PRUEBA_GEOCERCA_NUEVA: ${{ inputs.prueba_geocerca_nueva }}
          PRUEBA_CASOS: ${{ inputs.prueba_casos }}
          PRUEBA_INFO_UNIDAD: ${{ inputs.prueba_info_unidad }}
          LABORES_RECALCULO: ${{ inputs.labores }}
          RECUPERAR_GEOCERCAS: ${{ inputs.recuperar_geocercas }}
        run: python3 reporte_hectareas.py

      - name: Guardar los datos de las pruebas (solo diagnostico)
        if: ${{ inputs.diagnostico != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: datos-diagnostico
          path: |
            tramos_diagnostico.json
            alertas_diagnostico.json
            casos_diagnostico.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Guardar los resultados en el repositorio
        run: |
          git config user.name "Reporte automatico"
          git config user.email "actions@users.noreply.github.com"
          git add memoria_hileras docs/datos
          # Solo se sube si hay resultados nuevos; antes se integra lo que se
          # haya subido a GitHub mientras corria (ej. un cambio de codigo).
          if ! git diff --staged --quiet; then
            git commit -m "Actualizacion automatica $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi

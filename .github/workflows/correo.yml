name: Reporte diario de flota por correo

# Envio diario (modo "diario"): lo lanza el Worker de Cloudflare a las 07:30 y
# 09:00 de Chile; los horarios de GitHub de abajo son el respaldo si el Worker
# falla, y "workflow_run" lo lanza al terminar la corrida de la noche. Todos
# usan la misma marca del dia (docs/datos/correo_enviado.json): el correo sale
# una sola vez. Sin el secreto CORREO_DESTINATARIOS no envia nada.
on:
  # Respaldos (GitHub los larga hasta 4-5 h tarde; minutos que no son en punto).
  # Si parten antes de las 07:30 esperan y el correo sale a las 07:45.
  schedule:
    - cron: '23 6,7 * * *'     # 03:23 de Chile (verano u invierno)
    - cron: '47 8,9 * * *'     # 05:47
    - cron: '43 10,11 * * *'   # 07:43
    - cron: '7 12,13 * * *'    # 09:07, respaldo del aviso de atraso
  workflow_run:
    workflows: ['Reporte diario de hectareas']
    types: [completed]
    branches: [main]   # un recalculo en otra rama nunca dispara el correo
  workflow_dispatch:
    inputs:
      modo:
        description: 'diario (el envio normal), vista_previa (no envia; archivo por 1 dia), prueba (solo a CORREO_PRUEBA), todos (manda ya el de ayer a todos), atraso (GPS tardio) o sensores (encendido y horometro); los dos ultimos solo leen Wialon'
        required: true
        default: 'vista_previa'
      fecha:
        description: 'Dia a reportar en vista_previa o prueba (AAAA-MM-DD). Vacio = ayer en hora de Chile.'
        required: false
        default: ''

permissions:
  contents: write   # marca del dia
  actions: write    # estado de la corrida de la noche y relanzarse para seguir esperando las 07:45

concurrency:
  group: correo-flota
  cancel-in-progress: false

jobs:
  correo:
    runs-on: ubuntu-latest
    timeout-minutes: 345   # puede esperar hasta las 07:45 (maximo 5 h 15 min y se relanza)
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Traer lo ultimo de GitHub
        run: git pull --ff-only origin main

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar librerias
        run: pip install -r requirements.txt

      - name: Armar y enviar el reporte
        env:
          WIALON_TOKEN: ${{ secrets.WIALON_TOKEN }}
          MODO_CORREO: ${{ inputs.modo || 'diario' }}
          FECHA_REPORTE: ${{ inputs.fecha }}
          CORREO_USUARIO: ${{ secrets.CORREO_USUARIO }}
          CORREO_CLAVE: ${{ secrets.CORREO_CLAVE }}
          CORREO_PRUEBA: ${{ secrets.CORREO_PRUEBA }}
          CORREO_DESTINATARIOS: ${{ secrets.CORREO_DESTINATARIOS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Reporte automatico"
          git config user.email "actions@users.noreply.github.com"
          python3 reporte_correo.py

      - name: Guardar la vista previa (1 dia)
        if: ${{ inputs.modo == 'vista_previa' || inputs.modo == 'sensores' }}
        uses: actions/upload-artifact@v4
        with:
          name: vista-previa-correo
          path: salida_correo/
          retention-days: 1

name: Revisar la planilla Maquinas en Operacion

# Lo lanza el Worker de Cloudflare cada 30 min de 07:00 a 21:00 de Chile
# (origen cron) y el boton "Actualizar desde la planilla" de reporte2.html
# (origen boton). Lee la planilla del Drive (SOLO LECTURA) y, solo si cambio,
# vuelve a armar los datos de reporte2 sin bajar GPS de Wialon. Si no cambio,
# no hace commit. Reglas en CLAUDE.md ("Actualizar desde la planilla").
run-name: Revisar planilla (${{ inputs.origen }})
on:
  workflow_dispatch:
    inputs:
      origen:
        description: 'cron o boton'
        required: false
        default: 'boton'

permissions:
  contents: write
  actions: write

# Una revision a la vez (la nueva reemplaza a la que espera).
concurrency:
  group: revisar-planilla
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar librerias
        run: pip install -r requirements.txt

      - name: Revisar la planilla
        id: revisar
        env:
          ORIGEN: ${{ inputs.origen }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git pull --ff-only origin main
          python3 planilla_revisar.py

      - name: Subir (solo si cambio)
        if: steps.revisar.outputs.cambio == 'si'
        run: |
          git config user.name "Reporte automatico"
          git config user.email "actions@users.noreply.github.com"
          git add docs/datos/reporte_diario.json docs/datos/operadores.json
          git commit -m "Planilla actualizada (${{ inputs.origen }})"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 10
          done
          exit 1
